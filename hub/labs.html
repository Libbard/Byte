<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>المختبر · Labs</title>
  <meta name="description" content="مختبرات تفاعلية تُجرَّب فيها مفاهيم المنهج بيدك.">

  <!--@1.LABH.1-->

  <script>
    (function(){
      var t=localStorage.getItem('garden_theme')||'dark';
      document.documentElement.setAttribute('data-theme',t);
      var l=localStorage.getItem('garden_lang')||'ar';
      document.documentElement.setAttribute('lang',l);
      document.documentElement.setAttribute('dir',l==='ar'?'rtl':'ltr');
      var fs=localStorage.getItem('garden_font_size');
      if(fs) document.documentElement.setAttribute('data-font-size',fs);
    })();
  </script>

  <!-- garden-fontpath -->
  <link rel="stylesheet" href="../shared/vendor/fonts/garden/garden-core.css">
  <!-- /garden-fontpath -->
  <link rel="stylesheet" href="../shared/garden.css">
  <link rel="stylesheet" href="../shared/skin.css">
  <link rel="stylesheet" href="../shared/garden-header.css">
  <!--@1.LABH.2-->
  <link rel="stylesheet" href="../shared/sections.css?v=1.0.4.15">
  <link rel="stylesheet" href="../shared/select.css">
  <link rel="stylesheet" href="../shared/labs-hub.css?v=1.0.4.15">
  <link rel="stylesheet" href="../shared/surface.css?v=1.0.4.15">
  <link rel="stylesheet" href="../shared/bottom-nav.css">
  <link rel="stylesheet" href="../shared/vendor/fontawesome/css/garden-icons.css">

  <!-- data-garden-icons -->
  <link rel="icon" type="image/svg+xml" href="../shared/icons/logo-mark.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="../shared/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../shared/icons/favicon-16.png">
  <link rel="apple-touch-icon" href="../shared/icons/apple-touch-icon.png">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#1f2937">
  <!-- /data-garden-icons -->
<!--garden-ga-->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-HGTK36LR0M"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-HGTK36LR0M');</script>
<!--/garden-ga-->
</head>
<!--@1.LABH.3-->
<body data-page-title="المختبر" data-page-title-en="Labs" data-no-notes>

  <!--@1.LABH.4-->
  <header data-gh></header>

  <div class="sx-wrap main-content">

    <div class="sx-head">
      <h1 class="sx-title" data-ar="المختبر" data-en="Labs">المختبر</h1>
      <p class="sx-sub" data-ar="جرّب المفهوم بيدك: ابنِ، وغيّر المدخلات، وشاهد الدليل يتغيّر أمامك."
                        data-en="Try the concept yourself: build it, change the inputs, and watch the evidence change with you.">
        جرّب المفهوم بيدك: ابنِ، وغيّر المدخلات، وشاهد الدليل يتغيّر أمامك.
      </p>
    </div>

    <!--@1.LABH.5-->
    <div class="lx-stats" id="lx-stats" hidden></div>

    <!--@1.LABH.6-->
    <a class="lx-resume" id="lx-resume" href="#" hidden></a>

    <div class="sx-tools">
      <div class="sx-row">
        <div class="sx-search-wrap">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input class="sx-search" id="lx-q" type="search"
                 placeholder="ابحث باسم المختبر أو المفهوم أو المادة…"
                 data-ar-placeholder="ابحث باسم المختبر أو المفهوم أو المادة…"
                 data-en-placeholder="Search by lab, concept, or course…"
                 aria-label="ابحث في المختبرات"
                 autocomplete="off" spellcheck="false">
          <kbd class="sx-kbd">/</kbd>
        </div>

        <!--@1.LABH.7-->
        <select class="gs-me" id="lx-cat" data-gs-icon="fa-layer-group"></select>

        <!--@1.LABH.8-->
        <select class="gs-me" id="lx-course" data-gs-icon="fa-book"></select>

        <select class="gs-me" id="lx-sort" data-gs-icon="fa-arrow-down-wide-short"></select>
      </div>

      <div class="sx-chips">
        <!--@1.LABH.9-->
        <button class="sx-chip sx-chip--grp" id="lx-grp" type="button" aria-pressed="false"
                data-ar="حسب المجال" data-en="By domain">حسب المجال</button>

        <button class="sx-clear" id="lx-clear" hidden>
          <i class="fa-solid fa-eraser"></i>
          <span data-ar="مسح الفلاتر" data-en="Clear filters">مسح الفلاتر</span>
        </button>
      </div>

      <div class="sx-count" id="lx-count"></div>
    </div>

    <div class="lx-grid" id="lx-grid"></div>

    <!--@1.LABH.10-->
    <section class="lx-soon" id="lx-soon" hidden>
      <h2 class="lx-soon-t" data-ar="مجالاتٌ قادمة" data-en="Domains on the way">مجالاتٌ قادمة</h2>
      <p class="lx-soon-d" data-ar="هذه مجالاتُ المختبرات المخطَّطة. لا شيء يظهر هنا قبل أن يكتمل فعلاً."
                            data-en="These are the planned lab domains. Nothing appears here before it is genuinely finished.">
        هذه مجالاتُ المختبرات المخطَّطة. لا شيء يظهر هنا قبل أن يكتمل فعلاً.
      </p>
      <div class="lx-soon-l" id="lx-soon-l"></div>
    </section>

  </div>

  <noscript>
    <div class="sx-wrap main-content">
      <div class="sx-state">
        <i class="fa-solid fa-flask"></i>
        <b>يحتاج المختبر إلى JavaScript · Labs requires JavaScript</b>
        <span>فعّل الجافاسكربت لعرض المختبرات التفاعلية. · Enable JavaScript to view the interactive labs.</span>
      </div>
    </div>
  </noscript>

  <script src="../shared/endpoints.js"></script>
  <script src="../shared/garden.js"></script>
  <script src="../shared/garden-header.js"></script>
  <script src="../shared/select.js"></script>
  <script src="../shared/labs-hub.js?v=1.0.4.15"></script>
  <script src="../shared/bottom-nav.js"></script>
  <script src="../shared/sw-register.js"></script>
</body>
</html>
