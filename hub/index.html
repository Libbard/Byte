<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-HGTK36LR0M"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-HGTK36LR0M');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فصلي الدراسي · My Semester</title>

  <script>
    (function(){
      var t=localStorage.getItem('garden_theme')||'dark';
      document.documentElement.setAttribute('data-theme',t);
      var l=localStorage.getItem('garden_lang')||'ar';
      document.documentElement.setAttribute('lang',l);
      document.documentElement.setAttribute('dir',l==='ar'?'rtl':'ltr');
      var fs = localStorage.getItem('garden_font_size');
      if (fs) document.documentElement.setAttribute('data-font-size', fs);
    })();
  </script>

  <link rel="stylesheet" href="../shared/garden.css">
  <link rel="stylesheet" href="../shared/skin.css">
  <link rel="stylesheet" href="../shared/garden-header.css">
  <link rel="stylesheet" href="../shared/hub.css">
  <link rel="stylesheet" href="../shared/bottom-nav.css">
  <link rel="stylesheet" href="../shared/vendor/fontawesome/css/all.min.css">

  
  <link rel="icon" type="image/svg+xml" href="../shared/icons/logo-mark.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="../shared/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../shared/icons/favicon-16.png">
  <link rel="apple-touch-icon" href="../shared/icons/apple-touch-icon.png">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#a78bfa">
  
</head>
<body data-page-title="فصلي الدراسي" data-page-title-en="My Semester">


<header data-gh>
  <div class="hub-actions" data-gh-slot="actions">
    <a href="planner.html" class="toggle-btn" title="خطة فصلي · My plan" aria-label="Plan">📋</a>
    <a href="gpa.html" class="toggle-btn" title="المعدل الدراسي · GPA" aria-label="GPA">📊</a>
    <a href="schedule.html" class="toggle-btn" title="الجدول الأسبوعي · Schedule" aria-label="Schedule">📅</a>
  </div>
</header>

<div class="hub-container">

  
  <div id="empty-state">
    <div class="empty-hero">
      <div class="empty-icon">🎓</div>
      <h2 data-ar="أنشئ فصلك الدراسي" data-en="Create Your Semester">أنشئ فصلك الدراسي</h2>
      <p data-ar="اختر موادك من أي مستوى وابدأ رحلتك" data-en="Pick courses from any level and start your journey">اختر موادك من أي مستوى وابدأ رحلتك</p>
      <button class="hub-btn hub-btn-primary" data-action="show-create">
        <i class="fa-solid fa-plus"></i>
        <span data-ar="إنشاء فصل جديد" data-en="Create New Semester">إنشاء فصل جديد</span>
      </button>
    </div>
  </div>

  
  <div id="active-state" hidden>

    
    <div class="hub-overview">
      <div class="overview-header">
        <div class="overview-title-group">
          <span class="hub-activity-dot" id="activity-dot" hidden data-action="toggle-activity" title="نشط"></span>
          <h2 id="overview-name">—</h2>
        </div>
        <div class="overview-actions">
          <button class="hub-btn hub-btn-secondary" data-action="show-rename" title="تعديل">
            <i class="fa-solid fa-pen"></i>
            <span class="btn-label" data-ar="تعديل" data-en="Rename">تعديل</span>
          </button>
          <button class="hub-btn hub-btn-secondary" data-action="archive">
            <i class="fa-solid fa-box-archive"></i>
            <span class="btn-label" data-ar="أرشفة" data-en="Archive">أرشفة</span>
          </button>
        </div>
      </div>
      <div class="overview-progress">
        <div class="progress-ring">
          <svg viewBox="0 0 80 80">
            <defs>
              <linearGradient id="ring-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#a78bfa"/>
                <stop offset="100%" stop-color="#3b82f6"/>
              </linearGradient>
            </defs>
            <circle class="progress-ring-bg" cx="40" cy="40" r="33"></circle>
            <circle id="progress-ring-fill" class="progress-ring-fill" cx="40" cy="40" r="33" stroke="url(#ring-gradient)" stroke-dasharray="207.345" stroke-dashoffset="207.345"></circle>
          </svg>
          <span class="progress-percent" id="progress-percent">0%</span>
        </div>
        <div>
          <div class="progress-detail" id="progress-detail">0 / 0</div>
        </div>
      </div>
      <div class="overview-stats" id="overview-stats"></div>
    </div>

    
    <div class="hub-notification" id="hub-notification" hidden data-action="notification-click">
      <i class="fa-solid fa-bell"></i>
      <span id="hub-notification-text"></span>
    </div>

    
    <div class="hub-courses-grid" id="hub-courses-grid"></div>

  </div>

  
  <hr class="glass-divider" id="glass-divider" hidden>

  
  <details class="hub-archive-section" id="hub-archive-section" hidden>
    <summary data-ar="📦 الفصول السابقة" data-en="📦 Previous Semesters">📦 الفصول السابقة</summary>
    <div id="archive-list"></div>
  </details>

</div>


<div class="hub-modal-overlay" id="modal-create-semester" hidden>
  <div class="hub-modal">
    <h3 data-ar="إنشاء فصل جديد" data-en="Create New Semester">إنشاء فصل جديد</h3>
    <label style="display:block;font-size:0.85rem;font-weight:600;color:var(--text-secondary);margin-bottom:0.4rem" data-ar="اسم الفصل" data-en="Semester Name">اسم الفصل</label>
    <input type="text" class="hub-input" id="semester-name-input" data-ar-placeholder="مثال: خريف 2026" data-en-placeholder="e.g., Fall 2026" placeholder="مثال: خريف 2026">
    <div class="hub-modal-actions">
      <button class="hub-btn hub-btn-secondary" data-action="close-modal" data-ar="إلغاء" data-en="Cancel">إلغاء</button>
      <button class="hub-btn hub-btn-primary" data-action="confirm-create" data-ar="إنشاء" data-en="Create">إنشاء</button>
    </div>
  </div>
</div>


<div class="hub-modal-overlay" id="modal-rename" hidden>
  <div class="hub-modal">
    <h3 data-ar="تعديل اسم الفصل" data-en="Rename Semester">تعديل اسم الفصل</h3>
    <label style="display:block;font-size:0.85rem;font-weight:600;color:var(--text-secondary);margin-bottom:0.4rem" data-ar="اسم الفصل" data-en="Semester Name">اسم الفصل</label>
    <input type="text" class="hub-input" id="rename-input" data-ar-placeholder="مثال: خريف 2026" data-en-placeholder="e.g., Fall 2026" placeholder="مثال: خريف 2026">
    <div class="hub-modal-actions">
      <button class="hub-btn hub-btn-secondary" data-action="close-modal" data-ar="إلغاء" data-en="Cancel">إلغاء</button>
      <button class="hub-btn hub-btn-primary" data-action="confirm-rename" data-ar="حفظ" data-en="Save">حفظ</button>
    </div>
  </div>
</div>


<div class="hub-modal-overlay" id="modal-add-course" hidden>
  <div class="hub-modal hub-modal-large">
    <div class="modal-header">
      <h3 style="margin:0" data-ar="إضافة مادة" data-en="Add Course">إضافة مادة</h3>
      <button class="hub-btn-icon" data-action="close-modal" title="إغلاق">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <input type="text" class="hub-input hub-search" id="hub-search" data-ar-placeholder="ابحث عن مادة..." data-en-placeholder="Search courses..." placeholder="ابحث عن مادة...">

    <div class="course-filters" id="course-filters"></div>

    <div class="course-catalog" id="course-catalog"></div>

    <div class="custom-course-section">
      <h4 data-ar="إضافة مادة يدوياً" data-en="Add Custom Course">إضافة مادة يدوياً</h4>
      <input type="text" class="hub-input" id="custom-name-ar" data-ar-placeholder="اسم المادة بالعربي" data-en-placeholder="Course name in Arabic" placeholder="اسم المادة بالعربي">
      <input type="text" class="hub-input" id="custom-name-en" data-ar-placeholder="Course name in English" data-en-placeholder="Course name in English" placeholder="Course name in English">
      <input type="number" class="hub-input" id="custom-credits" min="1" max="12" value="3" data-ar-placeholder="الساعات المعتمدة" data-en-placeholder="Credit Hours" placeholder="الساعات المعتمدة">
      <button class="hub-btn hub-btn-primary" data-action="add-custom" style="margin-top:0.5rem">
        <i class="fa-solid fa-plus"></i>
        <span data-ar="إضافة" data-en="Add">إضافة</span>
      </button>
    </div>
  </div>
</div>

<script src="../shared/garden.js"></script>
<script src="../shared/garden-header.js"></script>
<script src="../shared/garden-data.js"></script>
<script src="../shared/hub.js"></script>
<script src="../shared/bottom-nav.js"></script>
<script src="../shared/sw-register.js"></script>
<script src="../shared/firebase-sync.js"></script>

</body>
</html>
