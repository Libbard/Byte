<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-HGTK36LR0M"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-HGTK36LR0M');</script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المعدل الدراسي · GPA Calculator</title>
  <meta name="description" content="حاسبة المعدل الدراسي لطلاب علوم الحاسب - مقياس SEU 4.0">

  <script>
    (function(){
      var t=localStorage.getItem('garden_theme')||'dark';
      document.documentElement.setAttribute('data-theme',t);
      var l=localStorage.getItem('garden_lang')||'ar';
      document.documentElement.setAttribute('lang',l);
      document.documentElement.setAttribute('dir',l==='ar'?'rtl':'ltr');
      var fs=localStorage.getItem('garden_font_size');
      if(fs) document.documentElement.setAttribute('data-font-size',fs);
    })();
  </script>

  <link rel="stylesheet" href="../shared/garden.css">
  <link rel="stylesheet" href="../shared/reminders.css">
  <link rel="stylesheet" href="../shared/skin.css">
  <link rel="stylesheet" href="../shared/garden-header.css">
  <link rel="stylesheet" href="../shared/gpa.css">
  <link rel="stylesheet" href="../shared/bottom-nav.css">
  <link rel="stylesheet" href="../shared/vendor/fontawesome/css/all.min.css">

  
  <link rel="icon" type="image/svg+xml" href="../shared/icons/logo-mark.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="../shared/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../shared/icons/favicon-16.png">
  <link rel="apple-touch-icon" href="../shared/icons/apple-touch-icon.png">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#a78bfa">
  
</head>
<body data-page-title="المعدل الدراسي" data-page-title-en="GPA Calculator">

  
  <header data-gh></header>

  <div class="gpa-container">

    
    <section class="gpa-ring-section" id="gpa-ring-section">
      <div class="gpa-ring-wrapper" id="gpa-ring-wrapper">
        
      </div>
      <div class="gpa-ring-info">
        <div class="gpa-ring-value" id="gpa-cumulative">0.00</div>
        <div class="gpa-ring-label" data-ar="المعدل التراكمي" data-en="Cumulative GPA"></div>
        <div class="gpa-ring-sub" id="gpa-sub-info"></div>
      </div>
    </section>

    
    <div class="gpa-export-row" id="gpa-export-row">
      <button class="gpa-btn gpa-btn-secondary gpa-btn-sm" id="btn-export-png">
        <i class="fa-solid fa-camera"></i>
        <span data-ar="صورة PNG" data-en="PNG Image"></span>
      </button>
      <button class="gpa-btn gpa-btn-secondary gpa-btn-sm" id="btn-export-pdf">
        <i class="fa-solid fa-file-pdf"></i>
        <span data-ar="ملف PDF" data-en="PDF File"></span>
      </button>
    </div>

    
    <section class="gpa-section" id="current-semester-section">
      <div class="gpa-section-header">
        <h2 id="current-sem-title" data-ar="الفصل الحالي" data-en="Current Semester"></h2>
        <div class="gpa-sem-gpa">
          <span data-ar="معدل الفصل:" data-en="Semester GPA:"></span>
          <span class="gpa-sem-value" id="current-sem-gpa">—</span>
        </div>
      </div>

      
      <div class="gpa-table-wrapper" id="courses-table-wrapper">
        
      </div>

      
      <button class="gpa-add-manual-btn" id="btn-add-manual">
        <i class="fa-solid fa-plus"></i>
        <span data-ar="إضافة مادة" data-en="Add Course"></span>
      </button>
    </section>

    
    <section class="gpa-section gpa-what-if-section" id="what-if-section" style="display:none">
      <h2 data-ar="ماذا لو؟ 🤔" data-en="What if? 🤔"></h2>
      <p class="gpa-what-if-desc" data-ar="جرّب درجات مختلفة للمواد بدون تقدير وشاهد تأثيرها على معدلك"
         data-en="Try different grades for ungraded courses and see the impact on your GPA"></p>
      <div class="gpa-what-if-result" id="what-if-result">
        <span data-ar="المعدل المتوقع:" data-en="Expected GPA:"></span>
        <span class="gpa-what-if-value" id="what-if-gpa">—</span>
      </div>
    </section>

    
    <section class="gpa-section" id="record-section" style="display:none">
      <h2 data-ar="📦 السجل الأكاديمي" data-en="📦 Academic Record"></h2>
      <div id="record-list">
        
      </div>
    </section>

    
    <section class="gpa-section" id="forecast-section" style="display:none">
      <div class="gpa-section-header">
        <h2 data-ar="📈 التوقع حتى التخرج" data-en="📈 Forecast to graduation"></h2>
        <button class="gpa-btn" id="fc-add-sem">
          <span data-ar="+ فصل مخطّط" data-en="+ Planned semester"></span>
        </button>
      </div>

      
      <div class="fc-chart-wrap" id="fc-chart-wrap">
        <svg id="fc-chart" class="fc-chart" viewBox="0 0 640 220" preserveAspectRatio="none"
             role="img" aria-labelledby="fc-chart-title">
          <title id="fc-chart-title" data-ar="منحنى المعدل التراكمي" data-en="Cumulative GPA curve"></title>
        </svg>
        <div class="fc-legend">
          <span class="fc-legend-item"><i class="fc-swatch fc-swatch-past"></i><span data-ar="مسجّل" data-en="Recorded"></span></span>
          <span class="fc-legend-item"><i class="fc-swatch fc-swatch-plan"></i><span data-ar="متوقّع" data-en="Forecast"></span></span>
        </div>
      </div>

      
      <div class="fc-scenarios">
        <span class="fc-scen-label" data-ar="لو حصلت على:" data-en="If I score:"></span>
        <button class="fc-scen" data-scen="A+">A+</button>
        <button class="fc-scen" data-scen="A">A</button>
        <button class="fc-scen" data-scen="B+">B+</button>
        <button class="fc-scen" data-scen="B">B</button>
        <button class="fc-scen active" data-scen="" data-ar="خطتي" data-en="My plan"></button>
      </div>

      
      <div id="fc-plan-list"></div>

      
      <div class="fc-target">
        <h3 data-ar="🎯 حاسبة الهدف" data-en="🎯 Target calculator"></h3>
        <div class="fc-target-row">
          <label for="fc-target-input" data-ar="أريد التخرج بمعدل" data-en="I want to graduate with"></label>
          <input type="number" id="fc-target-input" min="0" max="4" step="0.05" value="3.50">
        </div>
        <div class="fc-target-out" id="fc-target-out"></div>
      </div>
    </section>

    
    <section class="gpa-empty" id="empty-state" style="display:none">
      <div class="gpa-empty-icon">📊</div>
      <p data-ar="لا توجد مواد — أنشئ فصلك أولاً من لوحة التحكم"
         data-en="No courses — create your semester first from the dashboard"></p>
      <a href="index.html" class="gpa-btn gpa-btn-primary">
        <span data-ar="الذهاب للوحة التحكم" data-en="Go to Dashboard"></span>
      </a>
    </section>

  </div>

  
  <div class="gpa-modal-overlay" id="modal-course-picker" style="display:none">
    <div class="gpa-modal gpa-modal-large">
      <div class="gpa-picker-head">
        <h3 data-ar="إضافة مادة" data-en="Add Course"></h3>
        <button class="gpa-picker-close" id="btn-close-picker" title="إغلاق"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <input type="text" id="picker-search" class="gpa-input" placeholder="ابحث عن مادة..."
             data-ar-placeholder="ابحث عن مادة..." data-en-placeholder="Search courses...">
      <div class="gpa-picker-list" id="picker-list"></div>
      <button class="gpa-add-manual-btn" id="btn-open-manual">
        <i class="fa-solid fa-pen"></i>
        <span data-ar="إضافة مادة يدوية (خارج القائمة)" data-en="Add manual course (not listed)"></span>
      </button>
    </div>
  </div>

  
  <div class="gpa-modal-overlay" id="modal-add-manual" style="display:none">
    <div class="gpa-modal">
      <h3 data-ar="إضافة مادة يدوياً" data-en="Add Course Manually"></h3>
      <input type="text" id="manual-name" class="gpa-input" data-ar-placeholder="اسم المادة (عربي أو إنجليزي)" data-en-placeholder="Course name (Arabic or English)" placeholder="اسم المادة (عربي أو إنجليزي)">
      <input type="number" id="manual-credits" class="gpa-input" placeholder="الساعات المعتمدة" value="3" min="1" max="12">
      <div class="gpa-modal-actions">
        <button class="gpa-btn gpa-btn-primary" id="btn-confirm-manual">
          <span data-ar="إضافة" data-en="Add"></span>
        </button>
        <button class="gpa-btn gpa-btn-secondary" id="btn-cancel-manual">
          <span data-ar="إلغاء" data-en="Cancel"></span>
        </button>
      </div>
    </div>
  </div>

  <script src="../shared/garden.js"></script>
  <script src="../shared/garden-header.js"></script>
  <script src="../shared/vendor/html2canvas.min.js"></script>
  <script src="../shared/vendor/jspdf.umd.min.js"></script>
  <script src="../shared/export.js"></script>
  <script src="../shared/garden-data.js"></script>
  <script src="../shared/gpa.js"></script>
  <script src="../shared/gpa-forecast.js"></script>
  <script src="../shared/bottom-nav.js"></script>
  <script src="../shared/sw-register.js"></script>
  <script src="../shared/reminders-db.js"></script>
  <script src="../shared/reminders.js"></script>
  <script src="../shared/firebase-sync.js"></script>
</body>
</html>
