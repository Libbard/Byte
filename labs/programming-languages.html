<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>مختبر لغات البرمجة · الحديقة الرقمية</title>
<!--@2.PRLH.1-->
<meta name="description" content="اكتب وشغّل ٣٠ لغةَ برمجة في متصفّحك — جافا وبايثون وSQL وC وغيرها — مع أمثلةِ مقرّراتك ومكتبةٍ من مئات الأمثلة الجاهزة.">
<meta property="og:title" content="مختبر لغات البرمجة · الحديقة الرقمية">
<meta property="og:description" content="اكتب وشغّل ٣٠ لغةَ برمجة في متصفّحك، مع أمثلةِ مقرّراتك ومكتبةٍ من مئات الأمثلة الجاهزة.">
<meta property="og:type" content="website">

<!--@2.PRLH.2-->
<link rel="icon" type="image/svg+xml" href="../shared/icons/logo-mark.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../shared/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../shared/icons/favicon-16.png">
<link rel="apple-touch-icon" href="../shared/icons/apple-touch-icon.png">
<meta name="theme-color" content="#1f2937">

<!--@2.PRLH.3-->
<script>
(function(){
  var t=localStorage.getItem('garden_theme')||'dark';
  document.documentElement.setAttribute('data-theme',t);
  var l=localStorage.getItem('garden_lang')||'ar';
  document.documentElement.setAttribute('lang',l);
  document.documentElement.setAttribute('dir',l==='ar'?'rtl':'ltr');
  var fs=localStorage.getItem('garden_font_size');
  if(fs)document.documentElement.setAttribute('data-font-size',fs);
  if(!localStorage.getItem('garden_sidebar'))localStorage.setItem('garden_sidebar','collapsed');
  if(localStorage.getItem('garden_sidebar')==='collapsed')document.documentElement.classList.add('sb-collapsed');
})();
</script>

<!-- garden-fontpath -->
<link rel="stylesheet" href="../shared/vendor/fonts/garden/garden-core.css">
<!-- /garden-fontpath -->
<link rel="stylesheet" href="../shared/garden.css">
<link rel="stylesheet" href="../shared/skin.css">
<link rel="stylesheet" href="../shared/garden-header.css">
<link rel="stylesheet" href="../shared/bottom-nav.css">
<link rel="stylesheet" href="../shared/vendor/fontawesome/css/garden-icons.css">
<link rel="stylesheet" href="../shared/labs-v2/lab-programming-languages.css?v=1.0.4.3">
</head>

<body data-page-title="مختبر لغات البرمجة" data-page-title-en="Programming Languages Lab" data-no-notes>

<header data-gh data-gh-variant="top" data-gh-up="../hub/labs.html"></header>

<!--@2.PRLH.4-->
<div class="pl-lab" data-lab-root>

  <!--@2.PRLH.5-->
  <aside class="pl-side" id="plSide">
    <!--@2.PRLH.6-->
    <div class="pl-side-tabs" role="tablist">
      <button class="pl-side-tab" data-side="files" role="tab" aria-selected="false"
              data-ar="الملفات" data-en="Files"></button>
      <button class="pl-side-tab is-on" data-side="examples" role="tab" aria-selected="true"
              data-ar="الأمثلة" data-en="Examples"></button>
      <button class="pl-side-tab" data-side="saves" role="tab" aria-selected="false"
              data-ar="محفوظاتي" data-en="My saves"></button>
    </div>

    <div class="pl-side-body" data-panel="files" hidden>
      <div class="pl-file is-on"><i class="fa-regular fa-file-code"></i><span class="ltr" id="plMainFile">Main.java</span></div>
      <button class="pl-dashed" id="plNewFile" data-ar="ملفٌّ جديد" data-en="New file"
              data-tip-ar="أضِف ملفاً إلى المشروع — المشاريعُ متعدّدةُ الملفات تعمل كما على جهازك"
              data-tip-en="Add a file — multi-file projects work just like on your machine">
        <i class="fa-solid fa-plus"></i><span></span>
      </button>
    </div>

    <!--@2.PRLH.7-->
    <div class="pl-side-body" data-panel="examples">
      <div class="pl-ex-search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="search" data-ph-ar="ابحث في الأمثلة…" data-ph-en="Search examples…"
               data-ar-label="ابحث في الأمثلة" aria-label="ابحث في الأمثلة">
      </div>
      <div class="pl-ex-host" id="plExHost"></div>
    </div>

    <div class="pl-side-body" data-panel="saves" hidden>
      <!--@2.PRLH.8-->
      <button class="pl-dashed" id="plSaveAs" data-ar="احفظ نسخةً باسم" data-en="Save a named copy"
              data-tip-ar="نسخةٌ مستقلّةٌ تسمّيها بنفسك — والحفظُ التلقائيُّ يبقى يعمل بجانبها"
              data-tip-en="An independent named copy — autosave keeps running alongside it">
        <i class="fa-solid fa-bookmark"></i><span></span>
      </button>
    </div>
  </aside>

  <!--@2.PRLH.9-->
  <div class="pl-grip" data-grip="side" role="separator" aria-orientation="vertical"
       tabindex="0" aria-label="اسحب لتوسيع عمود الملفات"></div>

  <!--@2.PRLH.10-->
  <section class="pl-main">

    <div class="pl-bar">
      <button class="pl-collapse" id="plSideToggle"
              data-tip-ar="طيُّ عمود الملفات" data-tip-en="Collapse the files column">‹</button>

      <div class="pl-lang" id="plLangWrap">
        <button class="pl-lang-btn" id="plLangBtn" aria-haspopup="listbox" aria-expanded="false"
                data-tip-ar="بدّل اللغة — ولكل لغةٍ مساحتُها فلا يضيع ما كتبتَه"
                data-tip-en="Switch language — each keeps its own workspace, nothing is lost">
          <span class="pl-lang-name ltr" id="plLangName">Java</span>
          <span class="pl-lang-ver ltr" id="plLangVer">15</span>
          <i class="fa-solid fa-chevron-down pl-car"></i>
        </button>
        <div class="pl-pop" id="plLangPop" role="listbox" hidden></div>
      </div>

      <!--@2.PRLH.11-->
      <button type="button" class="pl-tier" id="plTier" aria-label="مستوى التشغيل" data-ar-title="مستوى التشغيل" data-en-title="Runtime tier"></button>

      <span class="pl-spacer"></span>
      <span class="pl-saved" id="plSaved"></span>
      <!--@2.PRLH.12-->
      <button class="pl-icon pl-narrow-only" id="plLibraryBtn"
              data-tip-ar="تصفّح مكتبة الأمثلة" data-tip-en="Browse the example library">
        <i class="fa-solid fa-book-open"></i></button>
      <button class="pl-icon" id="plShare"
              data-tip-ar="انسخ رابطاً يفتح كودك عند من ترسله له — بلا حساب"
              data-tip-en="Copy a link that opens your code for anyone — no account needed">
        <i class="fa-solid fa-link"></i></button>
      <button class="pl-icon" id="plIO"
              data-tip-ar="استورد ملفَّ لغةٍ أو صدّر جلستك كاملةً"
              data-tip-en="Import a source file, or export your whole session">
        <i class="fa-solid fa-file-import"></i></button>
      <!--@2.PRLH.13-->
      <button class="pl-icon" id="plTheme"
              data-tip-ar="ثيمُ المحرّر والطرفية — طرفيةٌ سوداء، فيجوال ستوديو، مونوكاي، نهاريّ…"
              data-tip-en="Editor & terminal theme — black terminal, Visual Studio, Monokai, light…">
        <i class="fa-solid fa-palette"></i></button>
    </div>

    <div class="pl-editor-wrap">
      <div class="pl-gutter" id="plGutter" aria-hidden="true"></div>
      <div class="pl-code">
        <!--@2.PRLH.14-->
        <pre class="pl-hl ltr" id="plHighlight" aria-hidden="true"></pre>
        <textarea class="pl-editor ltr" id="plEditor" wrap="off" spellcheck="false" autocomplete="off"
                  autocapitalize="off" autocorrect="off" aria-label="محرّر الكود"></textarea>
      </div>
    </div>

    <div class="pl-keys" id="plKeys" aria-hidden="true">
      <button data-k="{">{</button><button data-k="}">}</button><button data-k="(">(</button>
      <button data-k=")">)</button><button data-k=";">;</button><button data-k='"'>"</button>
      <button data-k="'">'</button><button data-k="<">&lt;</button><button data-k=">">&gt;</button>
      <button data-k="=">=</button><button data-k="_">_</button><button data-k="\t">⇥</button>
    </div>

    <div class="pl-run">
      <button class="pl-primary" id="plRun"
              data-tip-ar="شغّل الكود — أو Ctrl+Enter" data-tip-en="Run the code — or Ctrl+Enter">
        <i class="fa-solid fa-play"></i><span data-ar="شغّل" data-en="Run"></span>
        <kbd class="ltr">Ctrl↵</kbd></button>
      <button class="pl-ghost" id="plInteractive"
              data-tip-ar="يقف البرنامجُ وينتظر إدخالك سطراً بسطر، كما على جهازك"
              data-tip-en="The program pauses and waits for your input, line by line">
        <i class="fa-solid fa-keyboard"></i><span data-ar="تشغيلٌ تفاعليّ" data-en="Interactive"></span></button>
      <button class="pl-ghost" id="plTerm"
              data-tip-ar="طرفيةٌ تكتب فيها أوامر الترجمة والتشغيل بيدك، داخل قفصٍ آمن"
              data-tip-en="A shell where you type compile/run commands yourself, safely caged">
        <i class="fa-solid fa-terminal"></i><span data-ar="طرفية" data-en="Terminal"></span></button>
      <span class="pl-spacer"></span>
      <span class="pl-quota" id="plQuota"
            data-tip-ar="حصّتُك اليوميةُ من الشرح والتقييم بالذكاء الاصطناعي، وتتّسع تلقائياً في نوافذ الاختبارات."
            data-tip-en="Your daily AI explain/review allowance — it widens automatically during exam windows.">
        <i class="fa-solid fa-wand-magic-sparkles"></i><span id="plQuotaN">٨٠</span></span>
    </div>
  </section>

  <div class="pl-grip" data-grip="out" role="separator" aria-orientation="vertical"
       tabindex="0" aria-label="اسحب لتوسيع لوح النتائج"></div>

  <!--@2.PRLH.15-->
  <section class="pl-out" id="plOut">
    <!--@2.PRLH.16-->
    <div class="pl-out-tabs" role="tablist">
      <div class="pl-out-tabs-scroll">
        <button class="pl-out-tab is-on" data-out="stdout" role="tab" aria-selected="true"
                data-ar="الناتج" data-en="Output"></button>
        <button class="pl-out-tab" data-out="stdin" role="tab" aria-selected="false"
                data-ar="المدخلات" data-en="Input"></button>
        <!--@2.PRLH.17-->
        <button class="pl-out-tab" data-out="problems" role="tab" aria-selected="false"
                data-tip-ar="ما يكتشفه المحرّرُ في كودك قبل أن تُشغّله"
                data-tip-en="What the editor spots in your code before you run it">
          <span data-ar="المشاكل" data-en="Problems"></span><b class="pl-badge" id="plProblemN" hidden></b></button>
        <button class="pl-out-tab" data-out="explain" role="tab" aria-selected="false"
                data-ar="الشرح" data-en="Explain"></button>
        <!--@2.PRLH.18-->
        <button class="pl-out-tab pl-side-only" data-side-tab="files" role="tab" aria-selected="false">
          <i class="fa-regular fa-file-code"></i><span data-ar="الملفات" data-en="Files"></span></button>
        <button class="pl-out-tab pl-side-only" data-side-tab="examples" role="tab" aria-selected="false">
          <i class="fa-solid fa-layer-group"></i><span data-ar="الأمثلة" data-en="Examples"></span></button>
        <button class="pl-out-tab pl-side-only" data-side-tab="saves" role="tab" aria-selected="false">
          <i class="fa-solid fa-bookmark"></i><span data-ar="محفوظاتي" data-en="Saves"></span></button>
      </div>
      <span class="pl-spacer"></span>
      <span class="pl-metrics ltr" id="plMetrics" hidden
            data-tip-ar="زمنُ التشغيل والذاكرةُ المستهلكة فعلاً"
            data-tip-en="Actual run time and memory used"></span>
      <!--@2.PRLH.19-->
      <button class="pl-collapse pl-wide-only" id="plOutDock" aria-pressed="false"
              data-tip-ar="أنزِل لوحَ الناتج إلى الأسفل بعرض المختبر"
              data-tip-en="Dock the output to the bottom, full width"><i class="fa-solid fa-down-long"></i></button>
      <button class="pl-collapse" id="plOutExpand"
              data-tip-ar="وسّع لوحَ الناتج ليملأ الشاشة"
              data-tip-en="Expand the output to fill the screen"><i class="fa-solid fa-expand"></i></button>
      <button class="pl-collapse" id="plOutToggle"
              data-tip-ar="طيُّ لوح الناتج" data-tip-en="Collapse the output panel">›</button>
    </div>

    <div class="pl-out-body" data-out-panel="stdout">
      <div class="pl-status" id="plStatus" hidden></div>
      <!--@2.PRLH.20-->
      <div class="pl-prev-bar" id="plPrevBar" hidden>
        <button data-w="375" data-ar="جوّال" data-en="Phone"><span></span></button>
        <button data-w="768" data-ar="لوحيّ" data-en="Tablet"><span></span></button>
        <button data-w="0" class="is-on" data-ar="كامل" data-en="Full"><span></span></button>
      </div>
      <div class="pl-empty" id="plEmpty">
        <i class="fa-solid fa-play"></i>
        <p data-ar="اضغط «شغّل» — ثم غيّر أي شيءٍ وشغّل مرةً أخرى."
           data-en="Press Run — then change anything and run again."></p>
      </div>
      <pre class="pl-stdout" id="plStdout" hidden></pre>
      <!--@2.PRLH.21-->
      <iframe class="pl-preview" id="plPreview" hidden
              sandbox="allow-scripts" referrerpolicy="no-referrer"
              title="معاينة الصفحة"></iframe>
    </div>

    <!--@2.PRLH.22-->
    <div class="pl-out-body" data-out-panel="stdin" hidden>
      <label class="pl-lbl" for="plStdin"
             data-ar="ما يقرؤه البرنامج من لوحة المفاتيح:"
             data-en="What the program reads from the keyboard:"></label>
      <div class="pl-stdin-wrap">
        <div class="pl-stdin-ruler" id="plStdinRuler" aria-hidden="true"></div>
        <textarea class="pl-stdin" id="plStdin" spellcheck="false"
                  data-ph-ar="سطرٌ لكل إدخال…" data-ph-en="One line per input…"></textarea>
      </div>
      <p class="pl-stdin-foot"><span id="plStdinCount"></span>
        <em data-ar="يقرؤها البرنامجُ سطراً بعد سطر بترتيبها"
            data-en="The program reads them line by line, in order"></em></p>
    </div>

    <div class="pl-out-body" data-out-panel="problems" hidden>
      <div class="pl-problems" id="plProblems"></div>
    </div>

    <!--@2.PRLH.23-->
    <div class="pl-out-body" data-out-panel="explain" hidden></div>
    </div>
  </section>
</div>

<!--@2.PRLH.24-->
<script src="../shared/endpoints.js?v=1.0.4.3"></script>
<script src="../shared/garden.js"></script>
<script src="../shared/garden-header.js"></script>
<script src="../shared/bottom-nav.js"></script>

<script src="../shared/labs-v2/lab-pl-syntax.js?v=1.0.4.3"></script>
<script src="../shared/labs-v2/lab-pl-marie.js?v=1.0.4.3"></script>
<script src="../shared/labs-v2/lab-pl-sql.js?v=1.0.4.3"></script>
<script src="../shared/labs-v2/lab-pl-python.js?v=1.0.4.3"></script>
<script src="../shared/labs-v2/lab-pl-store.js?v=1.0.4.3"></script>
<script src="../shared/labs-v2/lab-pl-io.js?v=1.0.4.3"></script>
<script src="../shared/labs-v2/lab-programming-languages.js?v=1.0.4.3"></script>
</body>
</html>
