<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="mt md">
  <title id="mt">الحديقة الرقمية</title>
  <desc id="md">برعم ينمو من شبكة عُقد — النسخة المبسّطة من شعار الحديقة الرقمية.</desc>
  <!-- ═══════════════════════════════════════════════════════════
       شعار الحديقة الرقمية — النسخة المبسّطة (favicon · ≤48px)
       فروقها عن logo.svg مقصودة، لا اختصار كسول:
         • بلا ورقة: عند 32px لا تتجاوز الورقة 8 بكسل، ولا شكل يُقرأ
           في 8 بكسل — فتصير بقعةً تُشوّش الشكل. البرعم الأخضر يحمل
           معنى النمو بحجمٍ يُقرأ.
         • عُقدتان في الطبقة الوسطى بدل ثلاث، وخطوط أثخن، وفراغ أوسع.
       الطبقات الثلاث محفوظة (جذر ← فرعان ← برعم): هي معنى الشعار.
       يُولَّد منها favicon-16/32 عبر engine/enrich/generate_icons.py
       ═══════════════════════════════════════════════════════════ -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 88 V64" stroke="#10b981" stroke-width="8"/>
    <path d="M50 64 L22 42 M50 64 L78 42 M50 64 V34" stroke="#a78bfa" stroke-width="7"/>
  </g>
  <circle cx="50" cy="64" r="12" fill="#a78bfa"/>
  <circle cx="22" cy="42" r="9"  fill="#a78bfa"/>
  <circle cx="78" cy="42" r="9"  fill="#a78bfa"/>
  <circle cx="50" cy="26" r="14" fill="#10b981"/>
