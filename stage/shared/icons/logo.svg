<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="lt ld">
  <title id="lt">الحديقة الرقمية</title>
  <desc id="ld">شجرة عُقد بثلاث طبقات تعلوها ورقة — المعرفة تنمو طبقةً بعد طبقة.</desc>
  <!-- ═══════════════════════════════════════════════════════════
       شعار الحديقة الرقمية — النسخة الكاملة (≥64px)
       الطبقات الثلاث = عمق بطاقات المفاهيم (سطحي/كامل/عميق).
       currentColor في الساق ليرث لون السياق؛ العُقد بألوان الهوية.
       لا تُعدَّل يدوياً للأحجام الصغيرة — استخدم logo-mark.svg.
       ═══════════════════════════════════════════════════════════ -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- الجذع -->
    <path d="M50 88 V70" stroke="#10b981" stroke-width="5"/>
    <!-- الطبقة 1 → 2 -->
    <path d="M50 70 L28 52 M50 70 L50 52 M50 70 L72 52" stroke="#a78bfa" stroke-width="3" opacity=".6"/>
    <!-- الطبقة 2 → 3 -->
    <path d="M28 52 L18 34 M28 52 L38 34 M50 52 L50 34 M72 52 L62 34 M72 52 L82 34"
          stroke="#a78bfa" stroke-width="2.4" opacity=".45"/>
    <!-- الطبقة 3 → الورقة -->
    <path d="M50 34 V18" stroke="#10b981" stroke-width="3"/>
  </g>
  <!-- العُقد: الجذر أكبر ثم تصغر صعوداً (الطبقة الأعمق أدقّ) -->
  <circle cx="50" cy="70" r="7" fill="#a78bfa"/>
  <circle cx="28" cy="52" r="5" fill="#a78bfa"/>
  <circle cx="50" cy="52" r="5" fill="#a78bfa"/>
  <circle cx="72" cy="52" r="5" fill="#a78bfa"/>
  <circle cx="18" cy="34" r="3.4" fill="#10b981"/>
  <circle cx="38" cy="34" r="3.4" fill="#10b981"/>
  <circle cx="50" cy="34" r="3.4" fill="#10b981"/>
  <circle cx="62" cy="34" r="3.4" fill="#10b981"/>
  <circle cx="82" cy="34" r="3.4" fill="#10b981"/>
  <!-- الورقة -->
  <path d="M50 18 C42 14 38 4 42 -2 C52 0 55 10 50 18 Z"
        transform="translate(0,6)" fill="#10b981"/>
</svg>
