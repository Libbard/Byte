<body data-page-title="الشعب الدراسية" data-page-title-en="Course Sections" data-no-notes>

  <!--@1.SECH.4-->
  <header data-gh></header>

  <div class="sx-wrap main-content">

    <div class="sx-head">
      <h1 class="sx-title" data-ar="الشعب الدراسية" data-en="Course Sections">الشعب الدراسية</h1>
      <!--@1.SECH.5-->
      <p class="sx-sub" data-ar="كل شعب الجامعة — بما فيها الممتلئة التي يخفيها البانر."
                        data-en="Every section — including the full ones Banner hides.">
        كل شعب الجامعة — بما فيها الممتلئة التي يخفيها البانر.
      </p>
    </div>

    <div class="sx-tools">
      <div class="sx-row">
        <div class="sx-search-wrap">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input class="sx-search" id="sx-q" type="search"
                 placeholder="ابحث برقم الشعبة أو المادة أو اسم الأستاذ…"
                 data-ar-placeholder="ابحث برقم الشعبة أو المادة أو اسم الأستاذ…"
                 data-en-placeholder="Search by CRN, course, or instructor…"
                 autocomplete="off" spellcheck="false">
          <kbd class="sx-kbd">/</kbd>
        </div>
        <!--@1.SECH.6-->
        <select class="gs-me gs-grow" id="sx-term" data-gs-icon="fa-calendar-days"></select>
        <!--@1.SECH.7-->
        <button class="sx-watch-b" id="sx-watch" type="button"
                title="متابعاتي وتنبيهاتها"
                data-ar-title="متابعاتي وتنبيهاتها" data-en-title="My watches and alerts">
          <i class="fa-solid fa-bell"></i>
          <span class="sx-watch-n" id="sx-watch-n" hidden></span>
        </button>
      </div>

      <!--@1.SECH.8-->
      <div class="sx-row">
        <select class="gs-me" multiple id="sx-ms-city" data-key="city" data-gs-icon="fa-location-dot"
                data-gs-all-ar="كل الفروع" data-gs-all-en="All branches"></select>

        <select class="gs-me" multiple id="sx-ms-subject" data-key="subject" data-gs-icon="fa-book"
                data-gs-all-ar="كل المواد" data-gs-all-en="All subjects"></select>

        <!--@1.SECH.9-->
        <select class="gs-me" id="sx-college" data-gs-icon="fa-building-columns"></select>

        <select class="gs-me" id="sx-major" data-gs-icon="fa-graduation-cap"></select>

        <!--@1.SECH.10-->
        <select class="gs-me" id="sx-mode" data-gs-icon="fa-chalkboard-user"></select>

        <!--@1.SECH.11-->
        <select class="gs-me" id="sx-days" data-gs-icon="fa-calendar-week"></select>

        <!--@1.SECH.12-->
        <select class="gs-me" id="sx-gender" data-gs-icon="fa-venus-mars"></select>

        <select class="gs-me" id="sx-status" data-gs-icon="fa-chair"></select>

        <select class="gs-me gs-grow" id="sx-sort" data-gs-icon="fa-arrow-down-wide-short"></select>
        <button class="sx-dir" id="sx-dir" type="button"
                data-ar-title="اتجاه الترتيب" data-en-title="Sort direction"
                title="اتجاه الترتيب"><i class="fa-solid fa-arrow-up-short-wide"></i></button>
      </div>

      <!--@1.SECH.13-->
      <div class="sx-chips">
        <!--@1.SECH.14-->
        <button class="sx-chip sx-chip--prep" data-group="prep" data-val="on"
                title="مواد السنة التحضيرية — تُعرض وحدها"
                data-ar="السنة التحضيرية" data-en="Prep year">السنة التحضيرية</button>

        <span class="sx-div"></span>
        <!--@1.SECH.15-->
        <button class="sx-chip sx-chip--grp" data-group="grp" data-val="on"
                data-ar="حسب المادة" data-en="By course">حسب المادة</button>

        <button class="sx-clear" id="sx-clear" hidden>
          <i class="fa-solid fa-eraser"></i>
          <span data-ar="مسح الفلاتر" data-en="Clear filters">مسح الفلاتر</span>
        </button>
      </div>

      <div class="sx-count" id="sx-count"></div>
    </div>

    <!--@1.SECH.16-->
    <div class="sx-basket" id="sx-basket" hidden></div>

    <!--@1.SECH.17-->
    <div class="sx-me" id="sx-me" hidden></div>

    <!--@1.SECH.18-->
    <div class="sx-cta" id="sx-cta" hidden>
      <i class="fa-solid fa-user-gear"></i>
      <div class="sx-cta-t">
        <b data-ar="خصّص الصفحة لك" data-en="Make this page yours">خصّص الصفحة لك</b>
        <span data-ar="حدّد كلّيتك وفرعك ومستواك مرة واحدة — فتُصفّى الشعب لك في كل جهاز."
              data-en="Set your college, campus and level once — sections filter themselves on every device.">
          حدّد كلّيتك وفرعك ومستواك مرة واحدة — فتُصفّى الشعب لك في كل جهاز.
        </span>
      </div>
      <button class="sx-cta-go" id="sx-cta-go" data-ar="ابدأ" data-en="Start">ابدأ</button>
      <button class="sx-cta-no" id="sx-cta-no" data-ar="ليس الآن" data-en="Not now">ليس الآن</button>
    </div>

    <div class="sx-grid" id="sx-grid"></div>
    <button class="sx-mini sx-more" id="sx-more" hidden></button>
  </div>

  <!--@1.SECH.19-->
  <div class="sx-modal" id="sx-modal">
    <div class="sx-modal-box">
      <div class="sx-modal-head">
        <i class="fa-solid fa-clock-rotate-left" id="sx-modal-icon" style="color:#a78bfa"></i>
        <div class="sx-modal-t">
          <h3 id="sx-modal-title"></h3>
          <!--@1.SECH.20-->
          <div id="sx-modal-sub" hidden></div>
        </div>
        <button class="sx-x" id="sx-x" aria-label="إغلاق"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="sx-modal-body"></div>
    </div>
  </div>

  <!--@1.SECH.21-->
  <div class="sx-modal" id="sx-setup">
    <div class="sx-modal-box sx-setup-box">
      <div class="sx-modal-head">
        <i class="fa-solid fa-user-gear" style="color:#a78bfa"></i>
        <div class="sx-modal-t">
          <h3 data-ar="إعداد ملفّك الدراسي" data-en="Your academic profile">إعداد ملفّك الدراسي</h3>
          <div id="sx-setup-sub"></div>
        </div>
        <button class="sx-x" id="sx-setup-x" aria-label="إغلاق"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="sx-steps" id="sx-steps"></div>
      <div id="sx-setup-body"></div>
      <div class="sx-setup-foot">
        <button class="sx-mini" id="sx-back" data-ar="رجوع" data-en="Back">رجوع</button>
        <button class="sx-primary" id="sx-next" data-ar="التالي" data-en="Next">التالي</button>
      </div>
    </div>
