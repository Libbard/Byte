<script>(function () {
  var P = '__stage__';
  function wrap(real) {
    function keys() {
      var o = [];
      for (var i = 0; i < real.length; i++) {
        var k = real.key(i);
        if (k && k.indexOf(P) === 0) o.push(k.slice(P.length));
      }
      return o;
    }
    var api = {
      getItem: function (k) { return real.getItem(P + k); },
      setItem: function (k, v) { return real.setItem(P + k, v); },
      removeItem: function (k) { return real.removeItem(P + k); },
      clear: function () { keys().forEach(function (k) { real.removeItem(P + k); }); },
      key: function (i) { var a = keys(); return i < a.length ? a[i] : null; }
    };
    Object.defineProperty(api, 'length', { get: function () { return keys().length; } });
    return api;
  }
  try {
    Object.defineProperty(window, 'localStorage',
      { value: wrap(window.localStorage), configurable: true });
    Object.defineProperty(window, 'sessionStorage',
      { value: wrap(window.sessionStorage), configurable: true });
  } catch (e) { window.__stageStorageFailed = true; }
  try {
    var db = window.indexedDB;
    if (db) {
      var op = db.open.bind(db), del = db.deleteDatabase.bind(db);
      db.open = function (n, v) { return v === undefined ? op(P + n) : op(P + n, v); };
      db.deleteDatabase = function (n) { return del(P + n); };
    }
  } catch (e) { window.__stageIdbFailed = true; }
  window.__STAGE__ = true;
})();</script>
