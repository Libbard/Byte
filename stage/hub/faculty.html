<body data-page-title="تقييمات الأساتذة" data-page-title-en="Faculty Ratings" data-no-notes>

  <header data-gh></header>

  <div class="sx-wrap main-content">

    <div class="sx-head">
      <h1 class="sx-title" data-ar="تقييمات الأساتذة" data-en="Faculty Ratings">تقييمات الأساتذة</h1>
      <p class="sx-sub" data-ar="ما قاله الطلاب فعلاً — بعددِ من قال، لا برأيٍ واحد."
                        data-en="What students actually said — with how many said it.">
        ما قاله الطلاب فعلاً — بعددِ من قال، لا برأيٍ واحد.
      </p>
    </div>

    <!--@1.FACH.3-->
    <div class="fc-stats" id="fc-stats" hidden></div>

    <div class="sx-tools">
      <div class="sx-row">
        <div class="sx-search-wrap has-hint">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input class="sx-search" id="fc-q" type="search"
                 placeholder="ابحث باسم الأستاذ أو رمز المادة…"
                 data-ar-placeholder="ابحث باسم الأستاذ أو رمز المادة…"
                 data-en-placeholder="Search by instructor or course code…"
                 autocomplete="off" spellcheck="false">
          <kbd class="sx-kbd">/</kbd>
          <!--@1.FACH.12-->
          <button class="sx-hint" id="fc-hint" type="button" aria-expanded="false"
                  aria-describedby="fc-hint-pop"
                  data-ar-title="لم تجد الأستاذ؟" data-en-title="Can’t find an instructor?"
                  aria-label="لم تجد الأستاذ؟" title="لم تجد الأستاذ؟">
            <i class="fa-solid fa-info" aria-hidden="true"></i>
          </button>
          <!--@1.FACH.10-->
          <span class="sx-hint-pop" id="fc-hint-pop" role="tooltip"
                data-ar="لم تجد الأستاذ؟ من لم يُقيَّم بعدُ يظهر أسفل النتائج — والأسرع أن تكتب اسمه كما في البانر ⁦(Alqahtani, Hassan)⁩ أو بريده."
                data-en="Can’t find an instructor? Anyone not rated yet appears below the results — fastest is to type their name exactly as Banner shows it (Alqahtani, Hassan) or their email.">
            لم تجد الأستاذ؟ من لم يُقيَّم بعدُ يظهر أسفل النتائج — والأسرع أن تكتب اسمه كما في البانر ⁦(Alqahtani, Hassan)⁩ أو بريده.
          </span>
        </div>

        <!--@1.FACH.4-->
        <select class="gs-me" id="fc-subject" data-gs-name-ar="المادة" data-gs-name-en="Subject" data-gs-icon="fa-book"></select>

        <select class="gs-me" id="fc-college" data-gs-name-ar="الكلية" data-gs-name-en="College" data-gs-icon="fa-building-columns"></select>

        <select class="gs-me" id="fc-major" data-gs-name-ar="التخصص" data-gs-name-en="Major" data-gs-icon="fa-graduation-cap"></select>

        <select class="gs-me" id="fc-gender" data-gs-name-ar="المقر" data-gs-name-en="Campus" data-gs-icon="fa-venus-mars"></select>

        <!--@1.FACH.5-->
        <select class="gs-me" id="fc-gap" data-gs-name-ar="الفجوة" data-gs-name-en="Gap" data-gs-icon="fa-link-slash"></select>

        <select class="gs-me" id="fc-sort" data-gs-name-ar="الترتيب" data-gs-name-en="Sort by" data-gs-icon="fa-arrow-down-wide-short"></select>
      </div>

      <div class="sx-chips">
        <!--@1.FACH.6-->
        <button class="sx-chip" id="fc-min" data-group="min" data-val="on"
                title="أخفِ من قُيِّم أقل من ثلاث مرات"
                data-ar="٣ تقييمات فأكثر" data-en="3+ ratings">٣ تقييمات فأكثر</button>

    </div>
  </div>

          <div id="fc-rate-sub"></div>
        </div>
        <button class="sx-x" id="fc-rate-x" aria-label="إغلاق"><i class="fa-solid fa-xmark"></i></button>
