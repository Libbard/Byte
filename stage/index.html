<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>انتهت نسخة الاختبار</title>
<meta name="robots" content="noindex,nofollow">
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#0f1117;
         color:#e6e8ef; font-family:system-ui,"Segoe UI",Tahoma,sans-serif; padding:1.5rem; }
  .b { max-width:26rem; text-align:center; background:#171a23; border:1px solid #262b38;
       border-radius:1.1rem; padding:2rem 1.5rem; }
  h1 { font-size:1.1rem; margin:0 0 .6rem; }
  p { color:#99a0b0; font-size:.92rem; line-height:1.7; margin:0 0 1.2rem; }
  a { display:inline-block; font-weight:700; font-size:.88rem; text-decoration:none;
      background:#a78bfa; color:#fff; border-radius:999px; padding:.55rem 1.15rem; }
</style>
<script>
  try {
    if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations()
      .then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
    if (window.caches) caches.keys().then(function (ks) {
      ks.forEach(function (k) { if (k.indexOf('stage-') === 0 || k.indexOf('base-') === 0) caches.delete(k); });
    });
  } catch (e) {}
</script>
</head>
<body>
  <div class="b">
    <h1>انتهت نسخةُ الاختبار</h1>
    <p>كانت هذه نسخةً تجريبيّةً لقياس الأداء، وقد اكتمل عملُها ودُمج في الموقع الحيّ.</p>
    <a href="https://libbard.github.io/Garden/">الحديقة الرقمية</a>
  </div>
</body>
</html>
