<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-HGTK36LR0M"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-HGTK36LR0M');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الحديقة الرقمية · Digital Garden</title>

  <script>
    (function(){
      var t=localStorage.getItem('garden_theme')||'dark';
      document.documentElement.setAttribute('data-theme',t);
      var l=localStorage.getItem('garden_lang')||'ar';
      document.documentElement.setAttribute('lang',l);
      document.documentElement.setAttribute('dir',l==='ar'?'rtl':'ltr');
      var fs = localStorage.getItem('garden_font_size');
      if (fs) document.documentElement.setAttribute('data-font-size', fs);
    })();
  </script>

  <link rel="stylesheet" href="shared/garden.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root {
      --dash-accent: #a78bfa;
      --dash-glow: rgba(167, 139, 250, 0.12);
    }

    
    .portal { max-width: 1100px; margin: 0 auto; padding: 2rem 2rem 4rem; }

    
    .dash-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 0;
      margin-bottom: 2rem;
    }
    .dash-brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--text-secondary);
      letter-spacing: 0.03em;
    }
    .dash-brand-icon {
      font-size: 1.3rem;
    }
    .dash-actions {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    
    .portal-hero {
      position: relative;
      padding: 4rem 2.5rem 3rem;
      border-radius: var(--radius-xl);
      overflow: hidden;
      margin-bottom: 3rem;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      text-align: center; 
    }
    .portal-hero::before {
      content: '';
      position: absolute; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='30' cy='30' r='1.5' fill='%237c3aed' opacity='0.3'/%3E%3Cpath d='M0 30h60M30 0v60' stroke='%237c3aed' stroke-width='0.2' opacity='0.15'/%3E%3C/svg%3E");
      opacity: 0.5;
      pointer-events: none;
    }
    .portal-hero-content { position: relative; z-index: 1; }
    
    .portal-hero h1 {
      font-size: clamp(2.25rem, 6vw, 3.5rem);
      font-weight: 900;
      margin-bottom: 0.75rem;
      line-height: 1.25;
      background: linear-gradient(135deg, var(--text-primary) 30%, var(--dash-accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .portal-metaphor {
      font-size: 1.1rem;
      color: var(--text-secondary);
      font-style: italic;
      max-width: 550px;
      line-height: 1.8;
      margin: 0 auto 1.5rem; 
    }
    .portal-stats {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 1.5rem; 
      margin-top: 1.5rem;
    }
    .portal-stat {
      display: flex; align-items: center; gap: 0.5rem;
      font-weight: 700; font-size: 0.95rem;
      color: var(--text-muted);
    }
    .portal-stat strong {
      color: #a78bfa;
      font-size: 1.25rem;
    }
    [data-theme="light"] .portal-stat strong {
      color: #0f1033;
    }

    
    .portal-section-wrapper {
      display: flex; align-items: center; gap: 1.5rem;
      margin: 3rem 0 2rem;
    }
    .portal-section-header {
      display: flex; align-items: center; justify-content: center; gap: 1rem;
      padding: 0 1rem;
      flex-shrink: 0;
    }
    .portal-section-header h2 {
      font-size: 1.4rem; font-weight: 800; margin: 0;
      white-space: nowrap;
    }
    .portal-divider {
      height: 2px;
      background: var(--border-color);
      border-radius: var(--radius-pill);
      position: relative;
      overflow: hidden;
      margin: 0;
      flex: 1;
    }
    .portal-divider::after {
      content: '';
      position: absolute; top: 0;
      width: 40px; height: 100%;
      background: #a78bfa;
      border-radius: var(--radius-pill);
    }
    .portal-divider.dir-ltr::after {
      left: -40px;
      animation: raceLineRTL 4s ease-in-out infinite;
    }
    .portal-divider.dir-rtl::after {
      right: -40px;
      animation: raceLineLTR 4s ease-in-out infinite;
    }
    [data-theme="light"] .portal-divider::after {
      background: #7c3aed;
    }
    @keyframes raceLineRTL {
      0%   { left: -40px; }
      100% { left: 100%; }
    }
    @keyframes raceLineLTR {
      0%   { right: -40px; }
      100% { right: 100%; }
    }

    
    .levels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.25rem;
      margin-bottom: 3rem;
    }

    
    .collections-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.25rem;
      margin-bottom: 3rem;
    }
    .collection-card {
      border-style: dashed;  
    }
    .collection-card .level-card-number {
      font-size: 1rem;
      width: auto; min-width: 44px;
      padding: 0 6px;
    }

    
    .level-card {
      display: flex; flex-direction: column;
      padding: 1.75rem;
      border-radius: var(--radius-xl);
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      transition: all 0.3s ease;
      text-decoration: none;
      color: inherit;
      position: relative;
      overflow: hidden;
    }
    .level-activity-dot {
      position: absolute;
      top: 1rem; left: 1rem;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--border-color);
      cursor: pointer;
      z-index: 5;
      transition: all 0.2s ease;
      border: 2px solid var(--bg-card);
      box-shadow: 0 0 0 1px var(--border-color);
    }
    [dir="ltr"] .level-activity-dot { left: auto; right: 1rem; }
    .level-activity-dot:hover {
      transform: scale(1.3);
      background: var(--text-muted);
    }
    .level-activity-dot.active {
      background: #34d399;
      box-shadow: 0 0 0 1px rgba(52,211,153,0.4), 0 0 8px -2px rgba(52,211,153,0.5);
    }
    .level-activity-dot.active:hover { background: #34d399; }
    .level-activity-dot.today { animation: dotPulse 2s infinite; }
    @keyframes dotPulse {
      0% { box-shadow: 0 0 0 0 rgba(52,211,153,0.5), 0 0 0 1px rgba(52,211,153,0.4); }
      70% { box-shadow: 0 0 0 8px rgba(52,211,153,0), 0 0 0 1px rgba(52,211,153,0.4); }
      100% { box-shadow: 0 0 0 0 rgba(52,211,153,0), 0 0 0 1px rgba(52,211,153,0.4); }
    }
    .level-card:hover:not(.level-disabled) {
      border-color: var(--card-accent, #a78bfa);
      transform: translateY(-4px);
      box-shadow: 0 12px 30px -8px var(--card-glow, rgba(124, 58, 237, 0.2)), 0 4px 10px -4px var(--shadow-base);
    }
    [data-theme="light"] .level-card:hover:not(.level-disabled) {
      border-color: var(--card-accent, #7c3aed);
      box-shadow: 0 12px 30px -8px var(--card-glow, rgba(124, 58, 237, 0.15));
    }
    .level-card-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1rem;
    }
    .level-card-number {
      width: 44px; height: 44px;
      border-radius: var(--radius-md);
      background: var(--card-accent, #a78bfa);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 1.1rem;
      letter-spacing: 0.5px;
    }
    .level-card-status {
      font-size: 0.72rem; font-weight: 700;
      padding: 0.25rem 0.75rem;
      border-radius: var(--radius-pill);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .level-card-status.active {
      background: rgba(16, 185, 129, 0.12);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }
    [data-theme="light"] .level-card-status.active {
      background: rgba(5, 150, 105, 0.08);
      color: #059669;
      border-color: rgba(5, 150, 105, 0.2);
    }
    .level-card-status.planned {
      background: rgba(100, 116, 139, 0.1);
      color: var(--text-muted);
      border: 1px solid rgba(100, 116, 139, 0.15);
    }
    .level-card h3 {
      font-size: 1.15rem; font-weight: 800;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
      line-height: 1.5;
    }
    .level-card-desc {
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.7;
      flex: 1;
      margin-bottom: 1rem;
    }
    .level-card-meta {
      display: flex; flex-wrap: wrap; gap: 0.75rem;
      font-size: 0.8rem; font-weight: 700;
      color: var(--text-muted);
    }
    .level-card-meta span {
      display: inline-flex; align-items: center; gap: 0.3rem;
    }

    
    .level-card.level-disabled {
      pointer-events: none;
      cursor: default;
    }
    .level-card.level-disabled > * {
      filter: grayscale(0.8);
      opacity: 0.4;
    }
    .level-card.level-disabled::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 1;
      border-radius: var(--radius-xl);
      pointer-events: none;
      background:
        repeating-linear-gradient(
          135deg,
          transparent,
          transparent 12px,
          rgba(128, 128, 128, 0.05) 12px,
          rgba(128, 128, 128, 0.05) 13px
        );
    }
    .level-card.level-disabled .level-card-number {
      background: linear-gradient(135deg, var(--gray-500), var(--gray-600));
    }

    
    .portal-contact {
      text-align: center;
      padding: 2rem;
      margin-top: 1rem;
    }
    .contact-link {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.7rem 1.5rem;
      border-radius: var(--radius-pill);
      background: var(--bg-elevated);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .contact-link:hover {
      border-color: #26a5e4;
      color: #26a5e4;
      background: rgba(38, 165, 228, 0.08);
    }
    .contact-link i {
      font-size: 1.1rem;
      color: #26a5e4;
    }

    
    .portal-footer {
      text-align: center;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border-color);
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    
    .fade-up {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .fade-up.visible {
      opacity: 1;
      transform: translateY(0);
    }

    
    @media (max-width: 768px) {
      .portal { padding: 1rem 1rem 3rem; }
      .portal-hero { padding: 2.5rem 1.5rem 2rem; }
      .portal-hero h1 { font-size: 1.75rem; }
      .levels-grid { grid-template-columns: 1fr; }
    }

    
    .semester-card-wrapper { margin-bottom: 1.5rem; }
    .semester-card {
      display: flex; align-items: center; gap: 1rem;
      padding: 1.25rem 1.5rem;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      text-decoration: none;
      color: inherit;
      transition: all 0.3s ease;
      position: relative;
    }
    .semester-card:hover {
      border-color: #a78bfa;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px -4px rgba(167,139,250,0.15);
    }
    .semester-card-info { flex: 1; min-width: 0; }
    .semester-card-title {
      font-size: 1rem; font-weight: 800; margin-bottom: 0.5rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .semester-card-meta {
      display: flex; gap: 1rem; flex-wrap: wrap;
      font-size: 0.8rem; color: var(--text-muted); font-weight: 600;
      margin-bottom: 0.6rem;
    }
    .semester-card-meta span { display: inline-flex; align-items: center; gap: 0.35rem; }
    .semester-card-meta i { font-size: 0.75rem; }
    .sc-meta-courses { color: var(--text-secondary); }
    .sc-meta-credits { color: #60a5fa; }
    .sc-due-badge { color: #f43f5e; font-weight: 700; }
    .semester-card-progress { display: flex; align-items: center; gap: 0.5rem; }
    .semester-card-bar {
      flex: 1; height: 5px;
      background: var(--bg-elevated);
      border-radius: 9999px;
      overflow: hidden;
    }
    .semester-card-fill {
      height: 100%;
      background: linear-gradient(90deg, #a78bfa, #3b82f6);
      border-radius: 9999px;
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      width: 0%;
    }
    .semester-card-percent {
      font-family: 'Rajdhani', 'Inter', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--text-muted); min-width: 32px;
      letter-spacing: 0.02em;
    }
    .semester-card-cta {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(167,139,250,0.1);
      border-radius: var(--radius-md);
      color: #a78bfa; flex-shrink: 0;
    }
    [dir="ltr"] .semester-card-cta i.fa-chevron-left { transform: scaleX(-1); }

    
    .semester-empty-card {
      display: flex; align-items: center; gap: 1rem;
      padding: 1.5rem 1.75rem;
      border: 2px dashed var(--border-color);
      border-radius: var(--radius-xl);
      text-decoration: none; color: inherit;
      transition: all 0.3s ease;
    }
    .semester-empty-card:hover {
      border-color: #a78bfa;
      background: rgba(167,139,250,0.04);
      transform: translateY(-2px);
    }
    .semester-empty-icon {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #a78bfa, #7c3aed);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 1.1rem; flex-shrink: 0;
      box-shadow: 0 4px 12px -3px rgba(124,58,237,0.4);
    }
    .semester-empty-text { flex: 1; }
    .semester-empty-title { font-size: 1rem; font-weight: 800; margin-bottom: 0.2rem; }
    .semester-empty-desc { font-size: 0.82rem; color: var(--text-muted); }
  </style>
</head>
<body>

<div class="portal">

  <header class="dash-header">
    <div class="dash-brand">
      <span class="dash-brand-icon">🌱</span>
      <span>Digital Garden</span>
    </div>
    <div class="dash-actions">
      <button class="toggle-btn" onclick="toggleLang()"><span id="lang-btn">EN</span></button>
      <button class="toggle-btn" onclick="toggleTheme()" title="Theme"><span id="theme-icon">🌙</span></button>
    </div>
  </header>

  <section class="portal-hero fade-up">
    <div class="portal-hero-content">
      <h1 id="hero-title">بايت</h1>
      <div class="portal-metaphor" id="hero-subtitle">علوم الحاسب — الجامعة السعودية الإلكترونية</div>

  <section class="semester-card-wrapper fade-up" id="semester-card-wrapper" hidden>
    <a href="hub/index.html" class="semester-card">
      <span class="level-activity-dot" id="sc-activity-dot" hidden onclick="toggleSemesterActivity(event)" title="نشط"></span>
      <div class="semester-card-info">

        <div class="semester-card-meta">

        </div>
        <div class="semester-card-progress">
          <div class="semester-card-bar"><div class="semester-card-fill" id="sc-fill"></div></div>
          <span id="sc-percent">0%</span>

      </div>
      <div class="semester-card-cta">
        <i class="fa-solid fa-chevron-left"></i>
      </div>
    </a>
  </section>

  <section class="semester-card-wrapper fade-up" id="semester-empty-card" hidden>
    <a href="hub/index.html" class="semester-empty-card">
      <div class="semester-empty-icon"><i class="fa-solid fa-graduation-cap"></i></div>
      <div class="semester-empty-text">
        <div class="semester-empty-title" data-ar="أنشئ فصلك الدراسي" data-en="Create Your Semester">أنشئ فصلك الدراسي</div>
        <div class="semester-empty-desc" data-ar="اختر موادك من أي مستوى وابدأ رحلتك" data-en="Pick courses from any level and start your journey">اختر موادك من أي مستوى وابدأ رحلتك</div>
      </div>
      <div class="semester-card-cta">
        <i class="fa-solid fa-chevron-left"></i>
      </div>
    </a>
  </section>

  <div class="portal-section-wrapper fade-up">
    <div class="portal-divider dir-ltr"></div>
    <div class="portal-section-header">
      <h2 id="section-title">🎓 المستويات الدراسية</h2>
    </div>
    <div class="portal-divider dir-rtl"></div>
  </div>

  <div class="levels-grid" id="levels-grid"></div>

  <div class="portal-section-wrapper fade-up" id="collections-section" style="display:none">
    <div class="portal-divider dir-ltr"></div>
    <div class="portal-section-header">
      <h2 id="collections-title">📚 مقررات أخرى</h2>
    </div>
    <div class="portal-divider dir-rtl"></div>
  </div>

  <div class="collections-grid" id="collections-grid"></div>

  <div class="portal-contact fade-up">
    <a href="https://t.me/Computing_and_Informatics" class="contact-link" target="_blank" rel="noopener">
      <i class="fa-brands fa-telegram"></i>
      <span id="contact-text">لللمزيد شاركنا في قروب كلية الحوسبة والمعلوماتية</span>
    </a>
  </div>

  <div class="portal-footer fade-up">
    <span id="footer-text">بايت © 2026 · SEU CS</span>
  </div>

</div>

<script>
(function() {
  'use strict';

  function arabicCount(n, s, d, p, isAdj) {
    if (n === 0) return n + ' ' + p;
    if (n === 1) return isAdj ? ('1 ' + s) : (s + ' واحدة');
    if (n === 2) return d;
    if (n >= 3 && n <= 10) return n + ' ' + p;
    return n + ' ' + s;
  }
  function smartCount(n, ar, en, isAdj) {
    var l = document.documentElement.getAttribute('lang') || 'ar';
    return (l === 'ar')
      ? arabicCount(n, ar[0], ar[1], ar[2], isAdj)
      : (n + ' ' + (n === 1 ? en[0] : en[1]));
  }
  function countWord(n, ar, en) {
    var l = document.documentElement.getAttribute('lang') || 'ar';
    if (l === 'ar') {
      if (n === 1) return ar[0];
      if (n === 2) return ar[1];
      if (n >= 3 && n <= 10) return ar[2];
      return ar[0];
    }
    return (n === 1) ? en[0] : en[1];
  }

  const i18n = {
    ar: {
      title: 'بايت',
      subtitle: 'علوم الحاسب — الجامعة السعودية الإلكترونية',
      section: '🎓 المستويات الدراسية',
      collections: '📚 مواد أخرى',
      footer: 'بايت © 2026 · SEU CS',
      levels: 'مستويات', subjects: 'مادة', modules: 'وحدة',
      active: 'نشط', planned: 'قريباً',
      required: 'إجبارية', elective: 'اختيارية',
      langBtn: 'EN',
      contact: 'للمزيد شاركنا في قروب كلية الحوسبة والمعلوماتية',
    },
    en: {
      title: 'Byte',
      subtitle: 'Computer Science — Saudi Electronic University',
      section: '🎓 Academic Levels',
      collections: '📚 Other Courses',
      footer: 'Byte © 2026 · SEU CS',
      levels: 'Levels', subjects: 'Subjects', modules: 'Modules',
      active: 'Active', planned: 'Coming Soon',
      required: 'Required', elective: 'Elective',
      langBtn: 'AR',
      contact: 'For more, join our College of Computing and Informatics group.',
    }
  };

  let lang = localStorage.getItem('garden_lang') || 'ar';
  let _cfg = null;

  function updateThemeIcon(theme) {
    const iconEl = document.getElementById('theme-icon');
    if (!iconEl) return;
    if (theme === 'dark') iconEl.textContent = '🌙';
    else if (theme === 'dim') iconEl.textContent = '🌘';
    else iconEl.textContent = '☀️';
  }

  
  window.toggleTheme = function() {
    const themes = ['dark', 'dim', 'light'];
    const cur = document.documentElement.getAttribute('data-theme') || 'dark';
    const next = themes[(themes.indexOf(cur) + 1) % themes.length];
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('garden_theme', next);
    updateThemeIcon(next);
  };

  updateThemeIcon(document.documentElement.getAttribute('data-theme') || 'dark');

  
  window.toggleLang = function() {
    lang = lang === 'ar' ? 'en' : 'ar';
    localStorage.setItem('garden_lang', lang);
    document.documentElement.setAttribute('lang', lang);
    document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
    renderAll();
  };

  const gardenColors = [
    { accent: '#3b82f6', glow: 'rgba(59,130,246,0.12)' }, 
    { accent: '#10b981', glow: 'rgba(16,185,129,0.12)' }, 
    { accent: '#a78bfa', glow: 'rgba(167,139,250,0.12)' }, 
    { accent: '#f59e0b', glow: 'rgba(245,158,11,0.12)' }, 
    { accent: '#f43f5e', glow: 'rgba(244,63,94,0.12)' }, 
    { accent: '#06b6d4', glow: 'rgba(6,182,212,0.12)' }  
  ];

  fetch('config/project.json')
    .then(r => r.json())
    .then(cfg => { _cfg = cfg; renderAll(); animateIn(); })
    .catch(err => console.error('Config load failed:', err));

  function renderAll() {
    if (!_cfg) return;
    const t = i18n[lang];
    const isAr = lang === 'ar';

    document.getElementById('hero-title').textContent = t.title;
    document.getElementById('hero-subtitle').textContent = t.subtitle;
    document.getElementById('section-title').textContent = t.section;
    document.getElementById('collections-title').textContent = t.collections;
    document.getElementById('footer-text').textContent = t.footer;
    document.getElementById('lang-btn').textContent = t.langBtn;
    document.getElementById('contact-text').textContent = t.contact;

    const levelOrder = ['level3','level4','level5','level6','level7','level8'];
    const uniqueCodes = new Set();
    levelOrder.forEach(lid => {
      const lvl = _cfg.levels[lid];
      if (!lvl) return;
      (lvl.subjects || []).forEach(c => uniqueCodes.add(c));
      (lvl.electives || []).forEach(c => uniqueCodes.add(c));
    });
    if (_cfg.collections && _cfg.collections.others) {
      (_cfg.collections.others.subjects || []).forEach(c => uniqueCodes.add(c));
    }
    let totalSubjects = uniqueCodes.size;
    let totalModules = 0;
    uniqueCodes.forEach(c => {
      const s = _cfg.subjects[c];
      if (s) totalModules += (s.modules || 0);
    });
    document.getElementById('stats-row').innerHTML =
      '<div class="portal-stat"><strong>' + levelOrder.length + '</strong> ' + countWord(levelOrder.length, ['مستوى','مستويين','مستويات'], ['Level','Levels']) + '</div>' +
      '<div class="portal-stat"><strong>' + totalSubjects + '</strong> ' + countWord(totalSubjects, ['مادة','مادتين','مواد'], ['Subject','Subjects']) + '</div>' +
      '<div class="portal-stat"><strong>' + totalModules + '</strong> ' + countWord(totalModules, ['وحدة','وحدتين','وحدات'], ['Module','Modules']) + '</div>';

    const grid = document.getElementById('levels-grid');
    grid.innerHTML = '';

    levelOrder.forEach((levelId, idx) => {
      const lvl = _cfg.levels[levelId];
      if (!lvl) return;

      const num = levelId.replace('level', '');
      const shortId = 'L' + num;
      const isActive = lvl.status === 'active';
      const allCodes = (lvl.subjects || []).concat(lvl.electives || []);
      const reqCount = (lvl.subjects || []).length;
      const electCount = (lvl.electives || []).length;

      const hasReady = allCodes.some(c => _cfg.subjects[c] && _cfg.subjects[c].ready === true);

      const card = document.createElement('a');
      card.className = 'level-card fade-up' + (hasReady ? '' : ' level-disabled');
      card.href = hasReady ? (shortId + '/index.html') : 'javascript:void(0)';
      card.style.transitionDelay = (idx * 0.07) + 's';

      const levelColor = gardenColors[idx % gardenColors.length];
      card.style.setProperty('--card-accent', levelColor.accent);
      card.style.setProperty('--card-glow', levelColor.glow);

      let modCount = 0;
      allCodes.forEach(c => {
        const s = _cfg.subjects[c];
        if (s) modCount += (s.modules || 0);
      });

      const previewNames = allCodes.slice(0, 3).map(c => {
        const s = _cfg.subjects[c];
        return s ? c : '';
      }).filter(Boolean);
      const moreCount = allCodes.length - previewNames.length;

      let descText = previewNames.join(' · ');
      if (moreCount > 0) descText += (isAr ? (' +' + moreCount + ' أخرى') : (' +' + moreCount + ' more'));

      let metaHtml = '<span><i class="fa-solid fa-book"></i> ' + reqCount + ' ' + t.required + '</span>';
      if (electCount > 0) {
        metaHtml += '<span><i class="fa-solid fa-shuffle"></i> ' + electCount + ' ' + t.elective + '</span>';
      }
      metaHtml += '<span><i class="fa-solid fa-cube"></i> ' + modCount + ' ' + t.modules + '</span>';

      card.innerHTML =
        '<span class="level-activity-dot" data-level="' + shortId + '" onclick="toggleLevelActivity(event, \'' + shortId + '\')" title="' + (isAr ? 'تفعيل' : 'Activate') + '"></span>' +
        '<div class="level-card-header">' +
          '<div class="level-card-number">' + shortId + '</div>' +
          (isActive ? '' : '<span class="level-card-status planned">' + t.planned + '</span>') +
        '</div>' +
        '<h3>' + (isAr ? lvl.name_ar : lvl.name_en) + '</h3>' +
        '<div class="level-card-desc">' + descText + '</div>' +
        '<div class="level-card-meta">' + metaHtml + '</div>';

      grid.appendChild(card);
    });

    
    const collectionsGrid = document.getElementById('collections-grid');
    const collectionsSection = document.getElementById('collections-section');
    if (collectionsGrid && _cfg.collections) {
      const collEntries = Object.entries(_cfg.collections).filter(([id, c]) => c.status === 'active');

      if (collEntries.length === 0) {
        collectionsSection.style.display = 'none';
      } else {
        collectionsSection.style.display = '';
        collectionsGrid.innerHTML = '';

        collEntries.forEach(([collId, coll], idx) => {
          const allCodes = coll.subjects || [];
          
          const isSubjectBuilt = (code, s) => {
            if (s.built !== undefined) return s.built;
            const isOthers = (coll.subjects || []).includes(code);
            return isOthers ? false : true;
          };
          const hasReady = allCodes.some(c => _cfg.subjects[c] && _cfg.subjects[c].ready === true);
          const hasBuilt = allCodes.some(c => _cfg.subjects[c] && isSubjectBuilt(c, _cfg.subjects[c]));

          const card = document.createElement('a');
          card.className = 'level-card collection-card fade-up' + (hasBuilt ? '' : ' level-disabled');
          card.href = hasBuilt ? (collId + '/index.html') : 'javascript:void(0)';
          card.style.transitionDelay = ((idx + levelOrder.length) * 0.07) + 's';

          
          card.style.setProperty('--card-accent', '#a78bfa');
          card.style.setProperty('--card-glow', 'rgba(167,139,250,0.12)');

          let modCount = 0;
          const readyCodes = allCodes.filter(c => _cfg.subjects[c] && _cfg.subjects[c].ready === true);
          readyCodes.forEach(c => {
            const s = _cfg.subjects[c];
            if (s) modCount += (s.modules || 0);
          });

          
          const categories = coll.categories || {};
          const categoryOrder = coll.category_order || [];
          const activeCatKeys = categoryOrder.filter(catKey =>
            readyCodes.some(code => _cfg.subjects[code] && _cfg.subjects[code].category === catKey)
          );
          const previewCats = activeCatKeys.slice(0, 3).map(catKey => {
            const cat = categories[catKey];
            return cat ? (isAr ? cat.name_ar : cat.name_en) : '';
          }).filter(Boolean);
          const moreCats = activeCatKeys.length - previewCats.length;

          let descText = previewCats.join(' · ');
          if (moreCats > 0) descText += (isAr ? (' +' + moreCats + ' أخرى') : (' +' + moreCats + ' more'));

          const collName = isAr ? coll.name_ar : coll.name_en;
          const collShort = coll.name_short_en || '?';
          const collDesc = isAr ? coll.description_ar : coll.description_en;

          card.innerHTML =
            '<span class="level-activity-dot" data-level="others" onclick="toggleLevelActivity(event, \'others\')" title="' + (isAr ? 'تفعيل' : 'Activate') + '"></span>' +
            '<div class="level-card-header">' +
              '<div class="level-card-number">' + collShort + '</div>' +
              (hasBuilt ? '' : '<span class="level-card-status planned">' + t.planned + '</span>') +
            '</div>' +
            '<h3>' + collName + '</h3>' +
            '<div class="level-card-desc">' + descText + '</div>' +
            '<div class="level-card-meta">' +
              '<span><i class="fa-solid fa-book"></i> ' + readyCodes.length + ' ' + t.subjects + '</span>' +
              '<span><i class="fa-solid fa-cube"></i> ' + modCount + ' ' + t.modules + '</span>' +
            '</div>';

          collectionsGrid.appendChild(card);
        });
      }
    }

    animateIn();
  }

  function animateIn() {
    requestAnimationFrame(() => {
      document.querySelectorAll('.fade-up').forEach(el => {
        setTimeout(() => el.classList.add('visible'), 80);
      });
    });
    if ('IntersectionObserver' in window) {
      const obs = new IntersectionObserver(entries => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            e.target.classList.add('visible');
            obs.unobserve(e.target);
          }
        });
      }, { threshold: 0.1 });
      document.querySelectorAll('.fade-up:not(.visible)').forEach(el => obs.observe(el));
    }

    
    function isVisitedToday(meta) {
      if (!meta || !meta.last_visit) return false;
      var t = new Date(); t.setHours(0,0,0,0);
      var l = new Date(meta.last_visit); l.setHours(0,0,0,0);
      return t.getTime() === l.getTime();
    }

    
    window.toggleLevelActivity = function(e, levelId) {
      if (e) { e.stopPropagation(); e.preventDefault(); }
      var activeLevel = null;
      try { activeLevel = localStorage.getItem('garden_active_level'); } catch(err) {}
      var deactivated = [];
      try { deactivated = JSON.parse(localStorage.getItem('garden_level_deactivated') || '[]'); } catch(err) {}

      if (activeLevel === levelId) {
        
        try { localStorage.removeItem('garden_active_level'); } catch(err) {}
        if (deactivated.indexOf(levelId) === -1) deactivated.push(levelId);
        try { localStorage.setItem('garden_level_deactivated', JSON.stringify(deactivated)); } catch(err) {}
      } else {
        
        try { localStorage.setItem('garden_active_level', levelId); } catch(err) {}
        var idx = deactivated.indexOf(levelId);
        if (idx !== -1) { deactivated.splice(idx, 1); try { localStorage.setItem('garden_level_deactivated', JSON.stringify(deactivated)); } catch(err) {} }
      }
      renderLevelDots();
    };

    function renderLevelDots() {
      var activeLevel = null;
      try { activeLevel = localStorage.getItem('garden_active_level'); } catch(e) {}
      var meta = null;
      try { meta = JSON.parse(localStorage.getItem('garden_level_meta') || '{}'); } catch(e) {}
      var l = document.documentElement.getAttribute('lang') || 'ar';
      var isAr = (l === 'ar');

      document.querySelectorAll('.level-activity-dot').forEach(function(dot) {
        var levelId = dot.getAttribute('data-level');
        if (!levelId) return;
        if (levelId === activeLevel) {
          dot.classList.add('active');
          dot.classList.remove('inactive');
          dot.title = isAr ? 'نشط — انقر للإلغاء' : 'Active — click to deactivate';
          var lm = meta[levelId];
          if (lm && isVisitedToday(lm)) dot.classList.add('today');
          else dot.classList.remove('today');
        } else {
          dot.classList.remove('active', 'today');
          dot.classList.add('inactive');
          dot.title = isAr ? 'تفعيل' : 'Activate';
        }
      });
    }

    
    window.toggleSemesterActivity = function(e) {
      if (e) { e.stopPropagation(); e.preventDefault(); }
      try {
        var sem = JSON.parse(localStorage.getItem('my_semester'));
        if (!sem) return;
        var isActive = (sem.is_active === true || sem.is_active === undefined);
        if (isActive) {
          sem.is_active = false; sem.is_pinned = false;
        } else {
          sem.is_active = true; sem.is_pinned = true; sem.was_activated = true;
        }
        sem.updated_at = new Date().toISOString();
        localStorage.setItem('my_semester', JSON.stringify(sem));
        renderSemesterCard();
      } catch(err) {}
    };

    function renderSemesterCard() {
      var wrapper = document.getElementById('semester-card-wrapper');
      var emptyCard = document.getElementById('semester-empty-card');
      if (!wrapper) return;
      try {
        var sem = JSON.parse(localStorage.getItem('my_semester'));
        if (!sem) {
          wrapper.hidden = true;
          if (emptyCard) emptyCard.hidden = false;
          return;
        }
        wrapper.hidden = false;
        if (emptyCard) emptyCard.hidden = true;
        var l = document.documentElement.getAttribute('lang') || 'ar';
        var isAr = (l === 'ar');
        var total = sem.courses ? sem.courses.length : 0;
        var done = sem.courses ? sem.courses.filter(function(c){return c.completed;}).length : 0;
        
        var totalPercent = 0;
        if (sem.courses) {
          sem.courses.forEach(function(entry) {
            if (entry.custom) { totalPercent += entry.completed ? 100 : 0; return; }
            if (entry.completed) { totalPercent += 100; return; }
            var info = entry.custom ? null : null; 
            var totalModules = 13;
            var quizzesDone = 0;
            for (var m = 1; m <= totalModules; m++) {
              var quizRaw = localStorage.getItem('garden_' + entry.code + '_m' + m + '_quiz');
              if (quizRaw !== null) quizzesDone++;
            }
            totalPercent += Math.round((quizzesDone / totalModules) * 100);
          });
        }
        var percent = total > 0 ? Math.round(totalPercent / total) : 0;
        var totalCredits = 0;
        var totalDue = 0;
        if (sem.courses) {
          sem.courses.forEach(function(entry) {
            if (entry.custom) { totalCredits += entry.credits || 3; return; }
            totalCredits += 3;
            for (var m = 1; m <= 13; m++) {
              var fcRaw = localStorage.getItem('garden_' + entry.code + '_m' + m + '_fc');
              if (fcRaw) {
                try {
                  var sm2 = JSON.parse(fcRaw);
                  Object.values(sm2).forEach(function(state) {
                    if (state && state.nextReview && state.nextReview <= Date.now()) totalDue++;
                  });
                } catch(e) {}
              }
            }
          });
        }
        document.getElementById('sc-name').textContent = sem.name || (isAr ? 'فصلي' : 'My Semester');

        
        var dot = document.getElementById('sc-activity-dot');
        if (dot) {
          var isActive = (sem.is_active === true || sem.is_active === undefined);
          dot.hidden = false;
          var meta = null;
          try { meta = JSON.parse(localStorage.getItem('garden_semester_meta') || '{}'); } catch(e) {}
          if (isActive) {
            dot.classList.add('active');
            dot.classList.remove('inactive');
            if (isVisitedToday(meta)) dot.classList.add('today');
            else dot.classList.remove('today');
            dot.title = isAr ? 'نشط — انقر للإلغاء' : 'Active — click to deactivate';
          } else {
            dot.classList.remove('active', 'today');
            dot.classList.add('inactive');
            dot.title = isAr ? 'تفعيل' : 'Activate';
          }
        }

        document.getElementById('sc-courses').innerHTML = '<i class="fa-solid fa-book"></i> ' + smartCount(total, ['مادة','مادتين','مواد'], ['course','courses']);
        document.getElementById('sc-courses').className = 'sc-meta-courses';
        document.getElementById('sc-credits').innerHTML = '<i class="fa-solid fa-scale-balanced"></i> ' + smartCount(totalCredits, ['ساعة','ساعتين','ساعات'], ['credit','credits']);
        document.getElementById('sc-credits').className = 'sc-meta-credits';
        var dueEl = document.getElementById('sc-due');
        if (totalDue > 0) {
          dueEl.hidden = false;
          dueEl.innerHTML = '<i class="fa-solid fa-bell"></i> ' + smartCount(totalDue, ['مستحقة','مستحقتين','مستحقة'], ['due','due'], true);
          dueEl.className = 'sc-due-badge';
        } else {
          dueEl.hidden = true;
        }
        var fillEl = document.getElementById('sc-fill');
        fillEl.style.width = '0%';
        requestAnimationFrame(function() {
          requestAnimationFrame(function() { fillEl.style.width = percent + '%'; });
        });
        document.getElementById('sc-percent').textContent = percent + '%';
      } catch (e) {
        wrapper.hidden = true;
        if (emptyCard) emptyCard.hidden = false;
      }
    }
    renderSemesterCard();
    renderLevelDots();
    var _scLangObs = new MutationObserver(function() { renderSemesterCard(); renderLevelDots(); });
    _scLangObs.observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
    document.addEventListener('garden:syncCompleted', function() { renderSemesterCard(); renderLevelDots(); });
    document.addEventListener('garden:semesterActivated', renderSemesterCard);
    document.addEventListener('garden:levelActivated', renderLevelDots);
  }
})();
</script>

<script src="shared/garden.js"></script>
<script src="shared/firebase-sync.js"></script>
</body>
