<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-HGTK36LR0M"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-HGTK36LR0M');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الحديقة الرقمية · Digital Garden</title>

  <script>
    (function(){
      var t=localStorage.getItem('garden_theme')||'dark';
      document.documentElement.setAttribute('data-theme',t);
      var l=localStorage.getItem('garden_lang')||'ar';
      document.documentElement.setAttribute('lang',l);
      document.documentElement.setAttribute('dir',l==='ar'?'rtl':'ltr');
      var fs = localStorage.getItem('garden_font_size');
      if (fs) document.documentElement.setAttribute('data-font-size', fs);
    })();
  </script>

  <link rel="stylesheet" href="shared/garden.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root {
      --dash-accent: #a78bfa;
      --dash-glow: rgba(167, 139, 250, 0.12);
    }

    
    .portal { max-width: 1100px; margin: 0 auto; padding: 2rem 2rem 4rem; }

    
    .dash-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 0;
      margin-bottom: 2rem;
    }
    .dash-brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--text-secondary);
      letter-spacing: 0.03em;
    }
    .dash-brand-icon {
      font-size: 1.3rem;
    }
    .dash-actions {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    
    .portal-hero {
      position: relative;
      padding: 4rem 2.5rem 3rem;
      border-radius: var(--radius-xl);
      overflow: hidden;
      margin-bottom: 3rem;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      text-align: center; 
    }
    .portal-hero::before {
      content: '';
      position: absolute; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='30' cy='30' r='1.5' fill='%237c3aed' opacity='0.3'/%3E%3Cpath d='M0 30h60M30 0v60' stroke='%237c3aed' stroke-width='0.2' opacity='0.15'/%3E%3C/svg%3E");
      opacity: 0.5;
      pointer-events: none;
    }
    .portal-hero-content { position: relative; z-index: 1; }
    
    .portal-hero h1 {
      font-size: clamp(2.25rem, 6vw, 3.5rem);
      font-weight: 900;
      margin-bottom: 0.75rem;
      line-height: 1.25;
      background: linear-gradient(135deg, var(--text-primary) 30%, var(--dash-accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .portal-metaphor {
      font-size: 1.1rem;
      color: var(--text-secondary);
      font-style: italic;
      max-width: 550px;
      line-height: 1.8;
      margin: 0 auto 1.5rem; 
    }
    .portal-stats {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 1.5rem; 
      margin-top: 1.5rem;
    }
    .portal-stat {
      display: flex; align-items: center; gap: 0.5rem;
      font-weight: 700; font-size: 0.95rem;
      color: var(--text-muted);
    }
    .portal-stat strong {
      color: #a78bfa;
      font-size: 1.25rem;
    }
    [data-theme="light"] .portal-stat strong {
      color: #0f1033;
    }

    
    .portal-section-wrapper {
      display: flex; align-items: center; gap: 1.5rem;
      margin: 3rem 0 2rem;
    }
    .portal-section-header {
      display: flex; align-items: center; justify-content: center; gap: 1rem;
      padding: 0 1rem;
      flex-shrink: 0;
    }
    .portal-section-header h2 {
      font-size: 1.4rem; font-weight: 800; margin: 0;
      white-space: nowrap;
    }
    .portal-divider {
      height: 2px;
      background: var(--border-color);
      border-radius: var(--radius-pill);
      position: relative;
      overflow: hidden;
      margin: 0;
      flex: 1;
    }
    .portal-divider::after {
      content: '';
      position: absolute; top: 0;
      width: 40px; height: 100%;
      background: #a78bfa;
      border-radius: var(--radius-pill);
    }
    .portal-divider.dir-ltr::after {
      left: -40px;
      animation: raceLineRTL 4s ease-in-out infinite;
    }
    .portal-divider.dir-rtl::after {
      right: -40px;
      animation: raceLineLTR 4s ease-in-out infinite;
    }
    [data-theme="light"] .portal-divider::after {
      background: #7c3aed;
    }
    @keyframes raceLineRTL {
      0%   { left: -40px; }
      100% { left: 100%; }
    }
    @keyframes raceLineLTR {
      0%   { right: -40px; }
      100% { right: 100%; }
    }

    
    .levels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.25rem;
      margin-bottom: 3rem;
    }

    
    .collections-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.25rem;
      margin-bottom: 3rem;
    }
    .collection-card {
      border-style: dashed;  
    }
    .collection-card .level-card-number {
      font-size: 1rem;
      width: auto; min-width: 44px;
      padding: 0 6px;
    }

    
    .level-card {
      display: flex; flex-direction: column;
      padding: 1.75rem;
      border-radius: var(--radius-xl);
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      transition: all 0.3s ease;
      text-decoration: none;
      color: inherit;
      position: relative;
      overflow: hidden;
    }
    .level-card:hover:not(.level-disabled) {
      border-color: var(--card-accent, #a78bfa);
      transform: translateY(-4px);
      box-shadow: 0 12px 30px -8px var(--card-glow, rgba(124, 58, 237, 0.2)), 0 4px 10px -4px var(--shadow-base);
    }
    [data-theme="light"] .level-card:hover:not(.level-disabled) {
      border-color: var(--card-accent, #7c3aed);
      box-shadow: 0 12px 30px -8px var(--card-glow, rgba(124, 58, 237, 0.15));
    }
    .level-card-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1rem;
    }
    .level-card-number {
      width: 44px; height: 44px;
      border-radius: var(--radius-md);
      background: var(--card-accent, #a78bfa);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 1.1rem;
      letter-spacing: 0.5px;
    }
    .level-card-status {
      font-size: 0.72rem; font-weight: 700;
      padding: 0.25rem 0.75rem;
      border-radius: var(--radius-pill);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .level-card-status.active {
      background: rgba(16, 185, 129, 0.12);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }
    [data-theme="light"] .level-card-status.active {
      background: rgba(5, 150, 105, 0.08);
      color: #059669;
      border-color: rgba(5, 150, 105, 0.2);
    }
    .level-card-status.planned {
      background: rgba(100, 116, 139, 0.1);
      color: var(--text-muted);
      border: 1px solid rgba(100, 116, 139, 0.15);
    }
    .level-card h3 {
      font-size: 1.15rem; font-weight: 800;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
      line-height: 1.5;
    }
    .level-card-desc {
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.7;
      flex: 1;
      margin-bottom: 1rem;
    }
    .level-card-meta {
      display: flex; flex-wrap: wrap; gap: 0.75rem;
      font-size: 0.8rem; font-weight: 700;
      color: var(--text-muted);
    }
    .level-card-meta span {
      display: inline-flex; align-items: center; gap: 0.3rem;
    }

    
    .level-card.level-disabled {
      pointer-events: none;
      cursor: default;
    }
    .level-card.level-disabled > * {
      filter: grayscale(0.8);
      opacity: 0.4;
    }
    .level-card.level-disabled::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 1;
      border-radius: var(--radius-xl);
      pointer-events: none;
      background:
        repeating-linear-gradient(
          135deg,
          transparent,
          transparent 12px,
          rgba(128, 128, 128, 0.05) 12px,
          rgba(128, 128, 128, 0.05) 13px
        );
    }
    .level-card.level-disabled .level-card-number {
      background: linear-gradient(135deg, var(--gray-500), var(--gray-600));
    }

    
    .portal-contact {
      text-align: center;
      padding: 2rem;
      margin-top: 1rem;
    }
    .contact-link {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.7rem 1.5rem;
      border-radius: var(--radius-pill);
      background: var(--bg-elevated);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .contact-link:hover {
      border-color: #26a5e4;
      color: #26a5e4;
      background: rgba(38, 165, 228, 0.08);
    }
    .contact-link i {
      font-size: 1.1rem;
      color: #26a5e4;
    }

    
    .portal-footer {
      text-align: center;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border-color);
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    
    .fade-up {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .fade-up.visible {
      opacity: 1;
      transform: translateY(0);
    }

    
    @media (max-width: 768px) {
      .portal { padding: 1rem 1rem 3rem; }
      .portal-hero { padding: 2.5rem 1.5rem 2rem; }
      .portal-hero h1 { font-size: 1.75rem; }
      .levels-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="portal">

  <header class="dash-header">
    <div class="dash-brand">
      <span class="dash-brand-icon">🌱</span>
      <span>Digital Garden</span>
    </div>
    <div class="dash-actions">
      <button class="toggle-btn" onclick="toggleLang()"><span id="lang-btn">EN</span></button>
      <button class="toggle-btn" onclick="toggleTheme()" title="Theme"><span id="theme-icon">🌙</span></button>
    </div>
  </header>

  <section class="portal-hero fade-up">
    <div class="portal-hero-content">
      <h1 id="hero-title">بايت</h1>
      <div class="portal-metaphor" id="hero-subtitle">علوم الحاسب — الجامعة السعودية الإلكترونية</div>
      <div class="portal-stats" id="stats-row"></div>
    </div>
  </section>

  <div class="portal-section-wrapper fade-up">
    <div class="portal-divider dir-ltr"></div>
    <div class="portal-section-header">
      <h2 id="section-title">🎓 المستويات الدراسية</h2>
    </div>
    <div class="portal-divider dir-rtl"></div>
  </div>

  <div class="levels-grid" id="levels-grid"></div>

  <div class="portal-section-wrapper fade-up" id="collections-section" style="display:none">
    <div class="portal-divider dir-ltr"></div>
    <div class="portal-section-header">
      <h2 id="collections-title">📚 مقررات أخرى</h2>
    </div>
    <div class="portal-divider dir-rtl"></div>
  </div>

  <div class="collections-grid" id="collections-grid"></div>

  <div class="portal-contact fade-up">
    <a href="https://t.me/Computing_and_Informatics" class="contact-link" target="_blank" rel="noopener">
      <i class="fa-brands fa-telegram"></i>
      <span id="contact-text">لللمزيد شاركنا في قروب كلية الحوسبة والمعلوماتية</span>
    </a>
  </div>

  <div class="portal-footer fade-up">
    <span id="footer-text">بايت © 2026 · SEU CS</span>
  </div>

</div>

<script>
(function() {
  'use strict';

  const i18n = {
    ar: {
      title: 'بايت',
      subtitle: 'علوم الحاسب — الجامعة السعودية الإلكترونية',
      section: '🎓 المستويات الدراسية',
      collections: '📚 مواد أخرى',
      footer: 'بايت © 2026 · SEU CS',
      levels: 'مستويات', subjects: 'مادة', modules: 'وحدة',
      active: 'نشط', planned: 'قريباً',
      required: 'إجبارية', elective: 'اختيارية',
      langBtn: 'EN',
      contact: 'للمزيد شاركنا في قروب كلية الحوسبة والمعلوماتية',
    },
    en: {
      title: 'Byte',
      subtitle: 'Computer Science — Saudi Electronic University',
      section: '🎓 Academic Levels',
      collections: '📚 Other Courses',
      footer: 'Byte © 2026 · SEU CS',
      levels: 'Levels', subjects: 'Subjects', modules: 'Modules',
      active: 'Active', planned: 'Coming Soon',
      required: 'Required', elective: 'Elective',
      langBtn: 'AR',
      contact: 'For more, join our College of Computing and Informatics group.',
    }
  };

  let lang = localStorage.getItem('garden_lang') || 'ar';
  let _cfg = null;

  function updateThemeIcon(theme) {
    const iconEl = document.getElementById('theme-icon');
    if (!iconEl) return;
    if (theme === 'dark') iconEl.textContent = '🌙';
    else if (theme === 'dim') iconEl.textContent = '🌘';
    else iconEl.textContent = '☀️';
  }

  
  window.toggleTheme = function() {
    const themes = ['dark', 'dim', 'light'];
    const cur = document.documentElement.getAttribute('data-theme') || 'dark';
    const next = themes[(themes.indexOf(cur) + 1) % themes.length];
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('garden_theme', next);
    updateThemeIcon(next);
  };

  updateThemeIcon(document.documentElement.getAttribute('data-theme') || 'dark');

  
  window.toggleLang = function() {
    lang = lang === 'ar' ? 'en' : 'ar';
    localStorage.setItem('garden_lang', lang);
    document.documentElement.setAttribute('lang', lang);
    document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
    renderAll();
  };

  const gardenColors = [
    { accent: '#3b82f6', glow: 'rgba(59,130,246,0.12)' }, 
    { accent: '#10b981', glow: 'rgba(16,185,129,0.12)' }, 
    { accent: '#a78bfa', glow: 'rgba(167,139,250,0.12)' }, 
    { accent: '#f59e0b', glow: 'rgba(245,158,11,0.12)' }, 
    { accent: '#f43f5e', glow: 'rgba(244,63,94,0.12)' }, 
    { accent: '#06b6d4', glow: 'rgba(6,182,212,0.12)' }  
  ];

  fetch('config/project.json')
    .then(r => r.json())
    .then(cfg => { _cfg = cfg; renderAll(); animateIn(); })
    .catch(err => console.error('Config load failed:', err));

  function renderAll() {
    if (!_cfg) return;
    const t = i18n[lang];
    const isAr = lang === 'ar';

    document.getElementById('hero-title').textContent = t.title;
    document.getElementById('hero-subtitle').textContent = t.subtitle;
    document.getElementById('section-title').textContent = t.section;
    document.getElementById('collections-title').textContent = t.collections;
    document.getElementById('footer-text').textContent = t.footer;
    document.getElementById('lang-btn').textContent = t.langBtn;
    document.getElementById('contact-text').textContent = t.contact;

    const levelOrder = ['level3','level4','level5','level6','level7','level8'];
    let totalSubjects = 0, totalModules = 0;
    levelOrder.forEach(lid => {
      const lvl = _cfg.levels[lid];
      if (!lvl) return;
      const codes = (lvl.subjects || []).concat(lvl.electives || []);
      totalSubjects += codes.length;
      codes.forEach(c => {
        const s = _cfg.subjects[c];
        if (s) totalModules += (s.modules || 0);
      });
    });
    document.getElementById('stats-row').innerHTML =
      '<div class="portal-stat"><strong>' + levelOrder.length + '</strong> ' + t.levels + '</div>' +
      '<div class="portal-stat"><strong>' + totalSubjects + '</strong> ' + t.subjects + '</div>' +
      '<div class="portal-stat"><strong>' + totalModules + '</strong> ' + t.modules + '</div>';

    const grid = document.getElementById('levels-grid');
    grid.innerHTML = '';

    levelOrder.forEach((levelId, idx) => {
      const lvl = _cfg.levels[levelId];
      if (!lvl) return;

      const num = levelId.replace('level', '');
      const shortId = 'L' + num;
      const isActive = lvl.status === 'active';
      const allCodes = (lvl.subjects || []).concat(lvl.electives || []);
      const reqCount = (lvl.subjects || []).length;
      const electCount = (lvl.electives || []).length;

      const hasReady = allCodes.some(c => _cfg.subjects[c] && _cfg.subjects[c].ready === true);

      const card = document.createElement('a');
      card.className = 'level-card fade-up' + (hasReady ? '' : ' level-disabled');
      card.href = hasReady ? (shortId + '/index.html') : 'javascript:void(0)';
      card.style.transitionDelay = (idx * 0.07) + 's';

      const levelColor = gardenColors[idx % gardenColors.length];
      card.style.setProperty('--card-accent', levelColor.accent);
      card.style.setProperty('--card-glow', levelColor.glow);

      let modCount = 0;
      allCodes.forEach(c => {
        const s = _cfg.subjects[c];
        if (s) modCount += (s.modules || 0);
      });

      const previewNames = allCodes.slice(0, 3).map(c => {
        const s = _cfg.subjects[c];
        return s ? c : '';
      }).filter(Boolean);
      const moreCount = allCodes.length - previewNames.length;

      let descText = previewNames.join(' · ');
      if (moreCount > 0) descText += (isAr ? (' +' + moreCount + ' أخرى') : (' +' + moreCount + ' more'));

      let metaHtml = '<span><i class="fa-solid fa-book"></i> ' + reqCount + ' ' + t.required + '</span>';
      if (electCount > 0) {
        metaHtml += '<span><i class="fa-solid fa-shuffle"></i> ' + electCount + ' ' + t.elective + '</span>';
      }
      metaHtml += '<span><i class="fa-solid fa-cube"></i> ' + modCount + ' ' + t.modules + '</span>';

      card.innerHTML =
        '<div class="level-card-header">' +
          '<div class="level-card-number">' + shortId + '</div>' +
          '<span class="level-card-status ' + (isActive ? 'active' : 'planned') + '">' +
            (isActive ? t.active : t.planned) +
          '</span>' +
        '</div>' +
        '<h3>' + (isAr ? lvl.name_ar : lvl.name_en) + '</h3>' +
        '<div class="level-card-desc">' + descText + '</div>' +
        '<div class="level-card-meta">' + metaHtml + '</div>';

      grid.appendChild(card);
    });

    
    const collectionsGrid = document.getElementById('collections-grid');
    const collectionsSection = document.getElementById('collections-section');
    if (collectionsGrid && _cfg.collections) {
      const collEntries = Object.entries(_cfg.collections).filter(([id, c]) => c.status === 'active');

      if (collEntries.length === 0) {
        collectionsSection.style.display = 'none';
      } else {
        collectionsSection.style.display = '';
        collectionsGrid.innerHTML = '';

        collEntries.forEach(([collId, coll], idx) => {
          const allCodes = coll.subjects || [];
          
          const isSubjectBuilt = (code, s) => {
            if (s.built !== undefined) return s.built;
            const isOthers = (coll.subjects || []).includes(code);
            return isOthers ? false : true;
          };
          const hasReady = allCodes.some(c => _cfg.subjects[c] && _cfg.subjects[c].ready === true);
          const hasBuilt = allCodes.some(c => _cfg.subjects[c] && isSubjectBuilt(c, _cfg.subjects[c]));

          const card = document.createElement('a');
          card.className = 'level-card collection-card fade-up' + (hasBuilt ? '' : ' level-disabled');
          card.href = hasBuilt ? (collId + '/index.html') : 'javascript:void(0)';
          card.style.transitionDelay = ((idx + levelOrder.length) * 0.07) + 's';

          
          card.style.setProperty('--card-accent', '#a78bfa');
          card.style.setProperty('--card-glow', 'rgba(167,139,250,0.12)');

          let modCount = 0;
          const readyCodes = allCodes.filter(c => _cfg.subjects[c] && _cfg.subjects[c].ready === true);
          readyCodes.forEach(c => {
            const s = _cfg.subjects[c];
            if (s) modCount += (s.modules || 0);
          });

          
          const categories = coll.categories || {};
          const categoryOrder = coll.category_order || [];
          const activeCatKeys = categoryOrder.filter(catKey =>
            readyCodes.some(code => _cfg.subjects[code] && _cfg.subjects[code].category === catKey)
          );
          const previewCats = activeCatKeys.slice(0, 3).map(catKey => {
            const cat = categories[catKey];
            return cat ? (isAr ? cat.name_ar : cat.name_en) : '';
          }).filter(Boolean);
          const moreCats = activeCatKeys.length - previewCats.length;

          let descText = previewCats.join(' · ');
          if (moreCats > 0) descText += (isAr ? (' +' + moreCats + ' أخرى') : (' +' + moreCats + ' more'));

          const collName = isAr ? coll.name_ar : coll.name_en;
          const collShort = coll.name_short_en || '?';
          const collDesc = isAr ? coll.description_ar : coll.description_en;

          card.innerHTML =
            '<div class="level-card-header">' +
              '<div class="level-card-number">' + collShort + '</div>' +
              '<span class="level-card-status ' + (hasBuilt ? 'active' : 'planned') + '">' +
                (hasBuilt ? t.active : t.planned) +
              '</span>' +
            '</div>' +
            '<h3>' + collName + '</h3>' +
            '<div class="level-card-desc">' + descText + '</div>' +
            '<div class="level-card-meta">' +
              '<span><i class="fa-solid fa-book"></i> ' + readyCodes.length + ' ' + t.subjects + '</span>' +
              '<span><i class="fa-solid fa-cube"></i> ' + modCount + ' ' + t.modules + '</span>' +
            '</div>';

          collectionsGrid.appendChild(card);
        });
      }
    }

    animateIn();
  }

  function animateIn() {
    requestAnimationFrame(() => {
      document.querySelectorAll('.fade-up').forEach(el => {
        setTimeout(() => el.classList.add('visible'), 80);
      });
    });
    if ('IntersectionObserver' in window) {
      const obs = new IntersectionObserver(entries => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            e.target.classList.add('visible');
            obs.unobserve(e.target);
          }
        });
      }, { threshold: 0.1 });
      document.querySelectorAll('.fade-up:not(.visible)').forEach(el => obs.observe(el));
    }
  }
})();
</script>
